addView("wk16","Week 16: Tensions Rise & Taxation","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 16.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>To repay war debts, Britain passed a series of taxes on the colonies, including the Stamp Act and the Townshend Acts.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Colonists argued that because they had no representatives in Parliament, these taxes violated their rights, summarized by the phrase &#x27;no taxation without representation.&#x27;</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Boycotts and protests against British goods became powerful tools of colonial resistance.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Parliament</dt><dd>Britain&#x27;s law-making body</dd></div><div><dt>Boycott</dt><dd>A refusal to buy or use certain goods as a form of protest</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is the idea of &#x27;representation&#x27; still central to democratic government today?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 16 deck (Unit 2: Colonies & Revolution). Big idea: To repay war debts, Britain passed a series of taxes on the colonies, including the Stamp Act and the Townshend Acts. Words: Parliament, Boycott. Think and talk: Why is the idea of 'representation' still central to democratic government today? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk17","Week 17: Colonial Resistance","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 17.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Colonial anger boiled over in events like the Boston Massacre (1770), where British soldiers killed five colonists during a confrontation.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Boston Tea Party (1773) was a dramatic protest in which colonists dumped British tea into Boston Harbor rather than pay a tax on it.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Britain responded with the Intolerable Acts, harsh laws meant to punish Massachusetts and reassert control.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Massacre</dt><dd>The violent killing of a number of people</dd></div><div><dt>Intolerable Acts</dt><dd>Harsh British laws passed to punish the colonies after the Boston Tea Party</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How do escalating actions on both sides often lead to conflict?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 17 deck (Unit 2: Colonies & Revolution). Big idea: Colonial anger boiled over in events like the Boston Massacre (1770), where British soldiers killed five colonists during a confrontation. Words: Massacre, Intolerable Acts. Think and talk: How do escalating actions on both sides often lead to conflict? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes violence at the Boston Massacre. Preview the deck and keep the focus on cause and effect.");
addView("wk18","Week 18: The First Continental Congress & Skirmishes","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 18.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>In 1774, colonial leaders convened the First Continental Congress to organize a unified response to British policies.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Tensions erupted into armed conflict at Lexington and Concord in April 1775, marking the start of the Revolutionary War.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>These &#x27;shots heard round the world&#x27; showed that compromise was becoming increasingly unlikely.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Congress</dt><dd>A formal meeting of representatives to discuss and decide policy</dd></div><div><dt>Skirmish</dt><dd>A minor or preliminary conflict</dd></div></dl><h3>Think and talk</h3><p class=\"think\">What does it mean for a conflict to reach a &#x27;point of no return&#x27;?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 18 deck (Unit 2: Colonies & Revolution). Big idea: In 1774, colonial leaders convened the First Continental Congress to organize a unified response to British policies. Words: Congress, Skirmish. Think and talk: What does it mean for a conflict to reach a 'point of no return'? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk19","Week 19: The Declaration of Independence","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 19.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Written primarily by Thomas Jefferson, the Declaration of Independence was adopted on July 4, 1776, formally announcing the colonies&#x27; break from Britain.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>It asserts that all people possess unalienable rights, including life, liberty, and the pursuit of happiness.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The document also lists specific grievances against King George III, justifying the colonies&#x27; decision to separate.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Unalienable Rights</dt><dd>Rights that cannot be taken away or given up</dd></div><div><dt>Grievance</dt><dd>A formal complaint about unfair treatment</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why do ideas from the Declaration of Independence continue to shape political movements today?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 19 deck (Unit 2: Colonies & Revolution). Big idea: Written primarily by Thomas Jefferson, the Declaration of Independence was adopted on July 4, 1776, formally announcing the colonies' break from Britain. Words: Unalienable Rights, Grievance. Think and talk: Why do ideas from the Declaration of Independence continue to shape political movements today? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk20","Week 20: The American Revolutionary War","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 20.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Revolutionary War pitted the colonies against the powerful British military, with France later joining as a key ally.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The American victory at Saratoga (1777) convinced France to formally support the colonies with troops and supplies.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The war effectively ended with the British surrender at Yorktown in 1781, and the Treaty of Paris (1783) formally recognized American independence.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Ally</dt><dd>A country or group that cooperates with another for a common purpose</dd></div><div><dt>Treaty</dt><dd>A formal, signed agreement between nations</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How might the outcome of the Revolutionary War have been different without foreign support?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 20 deck (Unit 2: Colonies & Revolution). Big idea: The Revolutionary War pitted the colonies against the powerful British military, with France later joining as a key ally. Words: Ally, Treaty. Think and talk: How might the outcome of the Revolutionary War have been different without foreign support? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes war. Preview the deck and keep the focus on turning points and outcomes.");
addView("wk21","Week 21: The Articles of Confederation","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 21.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>After independence, the states adopted the Articles of Confederation, America&#x27;s first national constitution, which created a weak central government.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Under the Articles, Congress could not levy taxes, regulate trade, or enforce laws, leaving the young nation vulnerable to internal and external problems.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Shays&#x27; Rebellion (1786 to 1787), an armed uprising of indebted farmers, revealed just how ineffective the national government had become.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Confederation</dt><dd>A group of states or nations united for a common purpose with limited central authority</dd></div><div><dt>Rebellion</dt><dd>Organized resistance against a government or authority</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is finding the right balance of government power such a difficult challenge?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 21 deck (Unit 3: Civics & the Constitution). Big idea: After independence, the states adopted the Articles of Confederation, America's first national constitution, which created a weak central government. Words: Confederation, Rebellion. Think and talk: Why is finding the right balance of government power such a difficult challenge? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk22","Week 22: The Constitutional Convention (1787)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 22.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Delegates gathered in Philadelphia in 1787 intending to revise the Articles of Confederation, but instead drafted an entirely new Constitution.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Virginia Plan proposed representation in Congress based on state population, favoring larger states.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The New Jersey Plan called for equal representation for every state, regardless of size, favoring smaller states.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Delegate</dt><dd>A person chosen to represent others at a meeting or convention</dd></div><div><dt>Representation</dt><dd>Having someone act or speak on your behalf, especially in government</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why do you think compromise was necessary to move forward with a new Constitution?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 22 deck (Unit 3: Civics & the Constitution). Big idea: Delegates gathered in Philadelphia in 1787 intending to revise the Articles of Confederation, but instead drafted an entirely new Constitution. Words: Delegate, Representation. Think and talk: Why do you think compromise was necessary to move forward with a new Constitution? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk23","Week 23: The Great Compromise & 3/5 Compromise","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 23.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Great Compromise combined both plans by creating a bicameral Congress: the Senate, with equal representation, and the House of Representatives, based on population.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Three-Fifths Compromise counted enslaved people as three-fifths of a person for purposes of representation and taxation, a deeply unjust decision that increased Southern political power.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>These compromises allowed the Constitution to move forward but left unresolved moral questions that would haunt the nation for decades.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Bicameral</dt><dd>Made up of two legislative houses or chambers</dd></div><div><dt>Compromise</dt><dd>An agreement in which each side gives up something to reach resolution</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Can a document be considered a success if some of its compromises caused lasting harm? Explain your view.</p></div>"+gameHTML("A definition to match with its word"),"From your Week 23 deck (Unit 3: Civics & the Constitution). Big idea: The Great Compromise combined both plans by creating a bicameral Congress: the Senate, with equal representation, and the House of Representatives, based on population. Words: Bicameral, Compromise. Think and talk: Can a document be considered a success if some of its compromises caused lasting harm? Explain your view. Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. The Three-Fifths Compromise was an unjust decision about enslaved people. Name it as unjust, use respectful language, and let students step back if they need to.");
addView("wk24","Week 24: The U.S. Constitution (Preamble & Goals)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 24.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Constitution, ratified in 1788, is the supreme law of the United States and establishes the structure of the federal government.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Preamble begins with &#x27;We the People,&#x27; emphasizing that governmental authority derives from the consent of the governed.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Preamble outlines six goals, including establishing justice, ensuring domestic tranquility, and promoting the general welfare.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Preamble</dt><dd>The introductory statement of the Constitution explaining its purpose</dd></div><div><dt>Consent of the Governed</dt><dd>The idea that government&#x27;s power comes from the people it governs</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How does the idea of government being based on the people&#x27;s consent shape citizens&#x27; rights and responsibilities today?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 24 deck (Unit 3: Civics & the Constitution). Big idea: The Constitution, ratified in 1788, is the supreme law of the United States and establishes the structure of the federal government. Words: Preamble, Consent of the Governed. Think and talk: How does the idea of government being based on the people's consent shape citizens' rights and responsibilities today? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk25","Week 25: The Three Branches of Government","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 25.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Constitution divides government power into three branches to prevent any one part from becoming too powerful.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Legislative Branch (Congress) creates laws, the Executive Branch (President) enforces them, and the Judicial Branch (Supreme Court) interprets them.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>This system of separation of powers is central to American constitutional democracy.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Separation of Powers</dt><dd>Dividing government responsibilities among different branches</dd></div><div><dt>Enforce</dt><dd>To make sure a law is obeyed</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is separation of powers considered essential to protecting individual liberty?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 25 deck (Unit 3: Civics & the Constitution). Big idea: The Constitution divides government power into three branches to prevent any one part from becoming too powerful. Words: Separation of Powers, Enforce. Think and talk: Why is separation of powers considered essential to protecting individual liberty? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk26","Week 26: Checks and Balances","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 26.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Checks and balances allow each branch of government to limit the powers of the other two, preventing abuse of authority.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>For example, the President can veto legislation, but Congress can override that veto with a two-thirds vote.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Supreme Court can declare laws unconstitutional through the process of judicial review.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Veto</dt><dd>The power of one branch to reject a decision made by another</dd></div><div><dt>Judicial Review</dt><dd>The power of courts to determine whether a law is constitutional</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Is slower government a fair trade-off for preventing abuse of power? Explain your reasoning.</p></div>"+gameHTML("A definition to match with its word"),"From your Week 26 deck (Unit 3: Civics & the Constitution). Big idea: Checks and balances allow each branch of government to limit the powers of the other two, preventing abuse of authority. Words: Veto, Judicial Review. Think and talk: Is slower government a fair trade-off for preventing abuse of power? Explain your reasoning. Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk27","Week 27: The Bill of Rights (Amendments 1–5)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 27.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Bill of Rights, ratified in 1791, consists of the first ten amendments to the Constitution and protects individual freedoms.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The First Amendment guarantees freedoms of speech, religion, press, assembly, and petition.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Amendments Two through Five address rights related to bearing arms, quartering soldiers, unreasonable searches, and due process.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Amendment</dt><dd>A formal change or addition to a legal document like the Constitution</dd></div><div><dt>Due Process</dt><dd>The legal requirement that the government must respect all of a person&#x27;s legal rights</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Which right in the Bill of Rights do you think is most important for a functioning democracy? Why?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 27 deck (Unit 3: Civics & the Constitution). Big idea: The Bill of Rights, ratified in 1791, consists of the first ten amendments to the Constitution and protects individual freedoms. Words: Amendment, Due Process. Think and talk: Which right in the Bill of Rights do you think is most important for a functioning democracy? Why? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk28","Week 28: The Bill of Rights (Amendments 6–10) & Later Amendments","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 28.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Amendments Six through Eight protect the rights of the accused, including the right to a speedy trial and protection from cruel and unusual punishment.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Ninth and Tenth Amendments address rights not specifically listed and powers reserved for the states.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Later amendments expanded rights further, including abolishing slavery (13th) and granting women&#x27;s suffrage (19th).</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Cruel and Unusual Punishment</dt><dd>Punishment considered excessively harsh or inhumane, prohibited by the 8th Amendment</dd></div><div><dt>Suffrage</dt><dd>The right to vote</dd></div></dl><h3>Think and talk</h3><p class=\"think\">What does the ongoing expansion of rights suggest about American democracy?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 28 deck (Unit 3: Civics & the Constitution). Big idea: Amendments Six through Eight protect the rights of the accused, including the right to a speedy trial and protection from cruel and unusual punishment. Words: Cruel and Unusual Punishment, Suffrage. Think and talk: What does the ongoing expansion of rights suggest about American democracy? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes the end of slavery and the long fight for the right to vote.");
addView("wk29","Week 29: Citizen Rights vs. Civic Responsibilities","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 29.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Citizens in a democracy hold both rights and responsibilities that work together to sustain a healthy society.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Rights include freedoms such as speech and a fair trial, while responsibilities include obeying laws, paying taxes, and serving on juries.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Civic participation, such as voting and community involvement, helps ensure that democracy continues to function effectively.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Civic Responsibility</dt><dd>A duty citizens are expected to fulfill for the good of society</dd></div><div><dt>Jury Duty</dt><dd>The civic responsibility to serve on a jury when called</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why might rights become meaningless without citizens fulfilling their responsibilities?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 29 deck (Unit 3: Civics & the Constitution). Big idea: Citizens in a democracy hold both rights and responsibilities that work together to sustain a healthy society. Words: Civic Responsibility, Jury Duty. Think and talk: Why might rights become meaningless without citizens fulfilling their responsibilities? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk30","Week 30: How a Bill Becomes a Law & Local Leadership","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 3: Civics &amp; the Constitution. Week 30.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>A bill begins as a proposed idea for a law and must pass through several stages in Congress before becoming law.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>After passing both the House and Senate, a bill goes to the President, who may sign it, veto it, or allow it to become law without a signature.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Local leaders, such as mayors and city council members, make decisions that directly affect daily community life.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Bill</dt><dd>A proposed law under consideration by a legislature</dd></div><div><dt>Local Government</dt><dd>The level of government that manages cities, towns, or counties</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is it valuable for citizens to understand both national and local governing processes?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 30 deck (Unit 3: Civics & the Constitution). Big idea: A bill begins as a proposed idea for a law and must pass through several stages in Congress before becoming law. Words: Bill, Local Government. Think and talk: Why is it valuable for citizens to understand both national and local governing processes? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk31","Week 31: The Nation Grows (Louisiana Purchase)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 31.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>In 1803, the United States purchased the Louisiana Territory from France for roughly $15 million, doubling the nation&#x27;s size.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>President Jefferson commissioned the Lewis and Clark Expedition to explore, map, and document this vast new territory.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The expedition relied heavily on the guidance of Sacagawea, a Shoshone woman who helped navigate and communicate with Native nations.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Territory</dt><dd>Land under the control of a government, not yet a state</dd></div><div><dt>Expedition</dt><dd>A journey undertaken for a specific purpose, such as exploration</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How did the Louisiana Purchase change the future of the United States?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 31 deck (Unit 4: Expansion & Economics). Big idea: In 1803, the United States purchased the Louisiana Territory from France for roughly $15 million, doubling the nation's size. Words: Territory, Expedition. Think and talk: How did the Louisiana Purchase change the future of the United States? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk32","Week 32: Westward Movement & Trails","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 32.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Thousands of Americans traveled west along trails like the Oregon Trail, seeking land, opportunity, and a fresh start.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The discovery of gold in California in 1848 triggered the Gold Rush, drawing prospectors from around the world.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The completion of the transcontinental railroad in 1869 dramatically reduced travel time and reshaped the American economy.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Pioneer</dt><dd>A person who is among the first to settle a new region</dd></div><div><dt>Transcontinental</dt><dd>Extending across an entire continent</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Was westward expansion an overall positive development for the United States? Consider multiple perspectives.</p></div>"+gameHTML("A definition to match with its word"),"From your Week 32 deck (Unit 4: Expansion & Economics). Big idea: Thousands of Americans traveled west along trails like the Oregon Trail, seeking land, opportunity, and a fresh start. Words: Pioneer, Transcontinental. Think and talk: Was westward expansion an overall positive development for the United States? Consider multiple perspectives. Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk33","Week 33: Impact on Indigenous Nations","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 33.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>As settlers pushed westward, Native American nations faced displacement, broken treaties, and violent conflict.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Indian Removal Act of 1830 forced the relocation of thousands of Native Americans from their ancestral homelands.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Trail of Tears refers to the deadly forced march of the Cherokee and other nations, during which thousands died from exposure, disease, and starvation.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Removal</dt><dd>The forced relocation of a group of people from their land</dd></div><div><dt>Ancestral Land</dt><dd>Land traditionally inhabited by a person&#x27;s ancestors</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is it important to examine westward expansion from multiple perspectives, including those most harmed by it?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 33 deck (Unit 4: Expansion & Economics). Big idea: As settlers pushed westward, Native American nations faced displacement, broken treaties, and violent conflict. Words: Removal, Ancestral Land. Think and talk: Why is it important to examine westward expansion from multiple perspectives, including those most harmed by it? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes forced removal and the deaths of thousands of Native people on the Trail of Tears. Preview the deck, use respectful, age-appropriate language, and let students step back if they need to.");
addView("wk34","Week 34: Foundational Economics (Supply & Demand)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 34.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Supply refers to how much of a good or service is available, while demand refers to how much consumers want to buy.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Prices tend to rise when demand exceeds supply, and fall when supply exceeds demand. This relationship is central to market economies.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Scarcity, or limited resources, forces individuals and societies to make economic choices.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Supply</dt><dd>The quantity of a good or service available</dd></div><div><dt>Demand</dt><dd>Consumer desire and willingness to pay for a good or service</dd></div><div><dt>Scarcity</dt><dd>The condition of limited resources relative to unlimited wants</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How does understanding supply and demand help you make smarter decisions as a consumer?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 34 deck (Unit 4: Expansion & Economics). Big idea: Supply refers to how much of a good or service is available, while demand refers to how much consumers want to buy. Words: Supply, Demand, Scarcity. Think and talk: How does understanding supply and demand help you make smarter decisions as a consumer? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk35","Week 35: Economic Choice & Opportunity Cost","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 35.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Because resources are limited, individuals and societies must make choices, and every choice involves giving something up.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Opportunity cost is the value of the next best alternative that is given up when a decision is made.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Understanding opportunity cost helps people make more informed financial and personal decisions.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Opportunity Cost</dt><dd>The value of the best alternative given up when making a choice</dd></div><div><dt>Trade-off</dt><dd>Giving up one thing in return for another</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How can thinking about opportunity cost change the way you make decisions?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 35 deck (Unit 4: Expansion & Economics). Big idea: Because resources are limited, individuals and societies must make choices, and every choice involves giving something up. Words: Opportunity Cost, Trade-off. Think and talk: How can thinking about opportunity cost change the way you make decisions? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk36","Week 36: Goods, Services & Specialization","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 36.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>A good is a tangible item that can be bought or sold, while a service is a task performed for others, often for payment.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Specialization occurs when individuals, businesses, or regions focus on producing what they do best, then trade for other needs.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Specialization increases efficiency and productivity but also creates interdependence between producers.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Specialization</dt><dd>Focusing on producing a limited range of goods or services to increase efficiency</dd></div><div><dt>Interdependence</dt><dd>Mutual reliance between people, businesses, or nations</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How does specialization make economies more efficient, but also more interdependent?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 36 deck (Unit 4: Expansion & Economics). Big idea: A good is a tangible item that can be bought or sold, while a service is a task performed for others, often for payment. Words: Specialization, Interdependence. Think and talk: How does specialization make economies more efficient, but also more interdependent? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk37","Week 37: Media Literacy & Primary vs. Secondary Sources","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 37.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>A primary source is firsthand evidence from the time of an event, such as a diary, photograph, or official document.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>A secondary source analyzes or interprets events after they occurred, such as a textbook or documentary.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Media literacy involves evaluating sources for credibility, bias, and purpose before accepting information as fact.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Primary Source</dt><dd>Firsthand evidence created during the time period being studied</dd></div><div><dt>Bias</dt><dd>A tendency to favor one perspective over others, often unfairly</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How can misinformation spread if people don&#x27;t critically evaluate their sources?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 37 deck (Unit 4: Expansion & Economics). Big idea: A primary source is firsthand evidence from the time of an event, such as a diary, photograph, or official document. Words: Primary Source, Bias. Think and talk: How can misinformation spread if people don't critically evaluate their sources? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk38","Week 38: Voting & The Electoral System","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 38.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Voting allows citizens to choose their representatives and shape government policy, forming the foundation of democratic participation.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The secret ballot protects voters&#x27; privacy and helps prevent coercion or intimidation.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Political parties are organizations that share similar values and policy goals, helping to organize elections and governance.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Ballot</dt><dd>An official form used to record a vote</dd></div><div><dt>Political Party</dt><dd>An organized group of people with shared political goals</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is voting considered both a right and a responsibility in a democracy?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 38 deck (Unit 4: Expansion & Economics). Big idea: Voting allows citizens to choose their representatives and shape government policy, forming the foundation of democratic participation. Words: Ballot, Political Party. Think and talk: Why is voting considered both a right and a responsibility in a democracy? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk39","Week 39: Global Connections & Interdependence","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 39.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Countries around the world are economically interdependent, relying on international trade for resources, goods, and services.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Global cooperation, through organizations and agreements, helps address shared challenges like climate change, disease, and conflict.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Interdependence can create both opportunities for growth and vulnerabilities, such as supply chain disruptions.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Interdependence</dt><dd>Mutual reliance between countries or groups</dd></div><div><dt>Global Cooperation</dt><dd>Countries working together to solve shared problems</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Do the benefits of global interdependence outweigh the risks? Explain your reasoning.</p></div>"+gameHTML("A definition to match with its word"),"From your Week 39 deck (Unit 4: Expansion & Economics). Big idea: Countries around the world are economically interdependent, relying on international trade for resources, goods, and services. Words: Interdependence, Global Cooperation. Think and talk: Do the benefits of global interdependence outweigh the risks? Explain your reasoning. Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk40","Week 40: Year-End Capstone Project","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 4: Expansion &amp; Economics. Week 40.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>This year, you explored geography, early American history, government, and economics.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Each unit connects to build a deeper understanding of how history, geography, and civic life shape one another.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Now it&#x27;s time to reflect on your growth as a learner and synthesize what you&#x27;ve studied.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Synthesize</dt><dd>To combine information and ideas into a cohesive understanding</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How has this year&#x27;s coursework changed the way you think about history, government, or economics?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 40 deck (Unit 4: Expansion & Economics). Big idea: This year, you explored geography, early American history, government, and economics. Words: Synthesize. Think and talk: How has this year's coursework changed the way you think about history, government, or economics? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("jobstools","Jobs and Tools","Who uses this tool?",gameHTML("A tool to match with the worker who uses it"),"Big idea: different workers use different tools to do their jobs. Words: builder, farmer, chef, pilot, artist, tool, job. Ask: What tools does a teacher use? What job would you like to have? Pair with Community Helpers.");
addView("makechange","Making Change","How much change do you get back?",gameHTML("A money problem to solve"),"Big idea: change is the money you get back when you pay with more than the price. Words: price, pay, change, cents, subtract. Counting up helps: from the price, count up to the amount you paid. Pair with Make the Amount and Shopping Budget.");
addView("localstate","Local, State or National?","Which level of government does this?",gameHTML("A job of government to sort by level"),"Big idea: our government has three levels. Local government runs a city or town, state government runs a state, and the national (federal) government runs the whole country. Words: local, state, national, federal, mayor, governor, president. Some jobs are shared, so these are simplified examples. Pair with Who Leads?");
addView("seasons","Seasons","Which season is it?",gameHTML("A clue to match with a season"),"Big idea: a year has four seasons that happen in the same order every year. Words: winter, spring, summer, fall. Seasons can look different in different places, so use clues from your own area. Pair with Months of the Year and My Calendar.");
addView("dayafter","Day After, Day Before","Which day is it?",gameHTML("A day of the week question"),"Big idea: the days of the week come in a set order and repeat. Words: before, after, today, yesterday, tomorrow, Monday to Sunday. Ask: What day was yesterday? What day is tomorrow? Pair with My Calendar and Months of the Year.");
addView("causeeffect","Cause and Effect","Which effect came from this cause?",gameHTML("A cause in history to match with its effect"),"Challenge level. Big idea: events in history are connected. A cause is why something happened, and an effect is what happened because of it. Words: cause, effect, debt, boycott, surplus, removal. Ask: Can one cause have more than one effect? These examples come from the Weekly Topics. Some topics involve hard history, so use calm, respectful language.");
addView("primsec","Primary or Secondary Source?","Is it a primary source or a secondary source?",gameHTML("A source to sort as primary or secondary"),"Challenge level. Big idea: a primary source was made at the time of an event, and a secondary source was made later by someone who studied it. Words: primary source, secondary source, evidence, firsthand. Ask: Which is better for learning what people felt then? Pair with Week 37 and the Fact or Opinion? activity.");
addView("branchscen","Which Branch Acts?","Which branch does this?",gameHTML("A government action to match with a branch"),"Challenge level. Big idea: each branch has its own job. Congress (legislative) makes laws, the President (executive) carries them out, and the courts (judicial) decide what laws mean. Words: legislative, executive, judicial, veto, treaty, appoint. Pair with Weeks 25 and 26 and with Checks and Balances.");
addView("checks","Checks and Balances","Who is checking whom?",gameHTML("A government action to match with who checks whom"),"Challenge level. Big idea: each branch can limit the powers of the others so that no one branch gets too powerful. Words: checks and balances, veto, override, judicial review, impeach, confirm. Ask: Why might the Founders have wanted this? Pair with Week 26.");
addView("amend","Which Amendment?","Which amendment protects or does this?",gameHTML("A right to match with its amendment"),"Challenge level. Big idea: amendments are changes or additions to the Constitution. The first ten are the Bill of Rights. Words: amendment, Bill of Rights, ratify, suffrage, due process. The 13th and 19th Amendments came later. Pair with Weeks 27 and 28.");
addView("sdscenario","Supply and Demand Scenarios","What happens to the price?",gameHTML("A market situation to match with a price change"),"Challenge level. Big idea: when demand is higher than supply, prices tend to rise, and when supply is higher than demand, prices tend to fall. Words: supply, demand, scarcity, price, surplus. These are simple examples; real prices can have other causes. Pair with Week 34.");
addView("oppcost2","What Did You Give Up?","What is the opportunity cost?",gameHTML("A choice to match with its opportunity cost"),"Challenge level. Big idea: opportunity cost is the value of the next best choice you give up when you decide. Words: choice, trade-off, opportunity cost, scarcity. Ask: What did you give up when you chose to come to school today? Pair with Week 35.");
addView("factopinion","Fact or Opinion?","Is it a fact or an opinion?",gameHTML("A statement to sort as fact or opinion"),"Challenge level. Big idea: a fact can be checked and proven, and an opinion tells what someone thinks or feels. Words: fact, opinion, evidence, prove. Opinion words include best, worst, boring, and too. Pair with Primary or Secondary Source? and Week 37.");
addView("vocabctx","Word in the Sentence","Which word fits the blank?",gameHTML("A sentence with a missing word to complete"),"Challenge level. Big idea: we can use the other words in a sentence to figure out which vocabulary word fits. Words: compromise, amendment, boycott, treaty, surplus. Ask: What clue in the sentence helped you? Pair with the Weekly Topics word banks.");
addView("colonyregions","Which Colonial Region?","Which region fits the clue?",gameHTML("A clue to match with a colonial region"),"Challenge level. Big idea: the three colonial regions had different land, climates, and ways of life. Words: New England, Middle Colonies, Southern Colonies, plantation, cash crop, tolerance. The Southern Colonies’ plantations depended on the forced labor of enslaved Africans, which caused immense suffering, so use respectful language. Pair with Weeks 11 to 13.");
addView('compass','Compass Challenge','Which direction is the star from the dot?',
 gameHTML('A star placed in one of eight directions around a dot'),
 'Challenge level. Big idea: besides north, south, east and west, there are in-between directions: northeast, southeast, southwest and northwest. Words: north, south, east, west, northeast, southeast, southwest, northwest, compass rose. Ask: Which direction is halfway between south and west? Pair with Treasure Map and Map Key.');

addView('readgraph','Read the Graph','Read the bar graph to answer the question.',
 gameHTML('A bar graph of class votes for a field trip'),

uch of New England."], "wk12": ["Why were the Middle Colonies called the Breadbasket Colonies?", ["They produced a lot of wheat", "They had many bakeries", "They were near the ocean"], 0, "Yes! Wheat made them the breadbasket."], "wk13": ["Which are cash crops of the Southern Colonies?", ["Wheat and apples", "Fish and furs", "Tobacco, rice, and cotton"], 2, "Yes! Those cash crops grew in the warm South."], "wk14": ["What was the House of Burgesses?", ["A British court", "The first elected legislative body in the colonies", "A colonial army"], 1, "Yes! It was elected, and it made laws."], "wk15": ["Who fought the French and Indian War?", ["Britain and France, each with Native American allies", "Britain and Spain only", "The colonies and Canada"], 0, "Yes! Britain and France, with allies."], "wk16": ["What does “no taxation without representation” mean?", ["People should not be taxed if they have no voice in the government", "Taxes should always be lower", "Only kings can tax"], 0, "Yes! Colonists wanted a voice in government."], "wk17": ["What happened at the Boston Tea Party?", ["Soldiers fired at a crowd", "The colonies signed a treaty", "Colonists dumped British tea into Boston Harbor"], 2, "Yes! Colonists dumped the tea."], "wk18": ["What was the First Continental Congress?", ["A battle in 1775", "A meeting of colonial leaders in 1774", "A British army unit"], 1, "Yes! Colonial leaders met in 1774."], "wk19": ["Who wrote most of the Declaration of Independence?", ["George Washington", "Thomas Jefferson", "King George III"], 1, "Yes! Thomas Jefferson wrote most of it."], "wk20": ["Which victory convinced France to support the colonies?", ["Saratoga", "Lexington", "Boston"], 0, "Yes! Saratoga changed the war."], "wk21": ["What was a weakness of the Articles of Confederation?", ["The President was too powerful", "There were no states", "Congress could not tax or enforce laws"], 2, "Yes! The central government was too weak."], "wk22": ["What did delegates meet in Phi ion was written"], 1, "Yes! Unit 1 connected geography and human life."], "wk11": ["What did rocky soil lead New England colonists to rely on?", ["Fishing, shipbuilding, and trade", "Large cotton plantations", "Gold mining"], 0, "Yes! Geography shaped their economy."], "wk12": ["What made the Middle Colonies especially diverse?", ["Strict religious rules", "Religious tolerance and many cultures", "Very few settlers"], 1, "Yes! Many cultures lived there."], "wk13": ["What did plantations depend on?", ["The forced labor of enslaved Africans", "Paid workers only", "Machines"], 0, "Yes! Plantation agriculture depended on forced labor, which caused immense suffering."], "wk14": ["The Mayflower Compact set up self-government based on…", ["Majority rule", "A king’s orders", "A secret vote only"], 0, "Yes! Majority rule."], "wk15": ["Why did Britain tax the colonies after the war?", ["To build roads in Britain", "To repay its large war debt", "To pay Native nations"], 1, "Yes! Britain wanted to repay its debt."], "wk16": ["What is a boycott?", ["A kind of tax", "Refusing to buy certain goods as a protest", "A new law"], 1, "Yes! A boycott refuses to buy goods."], "wk17": ["What were the Intolerable Acts?", ["Harsh British laws to punish Massachusetts", "New colonial taxes", "A peace treaty"], 0, "Yes! Britain tried to punish and control the colonies."], "wk18": ["Where did armed conflict begin in April 1775?", ["Lexington and Concord", "Philadelphia", "Yorktown"], 0, "Yes! The war began at Lexington and Concord."], "wk19": ["Which rights does it say all people have?", ["Life, liberty, and the pursuit of happiness", "Free tea and taxes", "Voting for kings"], 0, "Yes! Life, liberty, and the pursuit of happiness."], "wk20": ["What formally recognized American independence in 1783?", ["The Declaration", "The Treaty of Paris", "The Constitution"], 1, "Yes! The Treaty of Paris."], "wk21": ["What did Shays’ Rebellion show?", ["The national government was too weak", "The Constituti function makeGame(cfg){
  const v=$('#'+cfg.id), svg=$('.gsvg',v), nameEl=$('.gname',v), box=$('.gchoices',v), msg=$('.gmsg',v), next=$('.gnext',v), scoreEl=$('.gscore',v);
  let order=[],idx=0,score=0,tried=0,busy=false;
  box.style.gridTemplateColumns='repeat('+cfg.cols+',1fr)';
  const btns=cfg.choices.map(c=>{
    const b=document.createElement('button'); b.className='btn';
    b.textContent=c[1];
    b.addEventListener('click',()=>guess(c[0])); box.appendChild(b); return b;
  });
  const setBtns=d=>btns.forEach(b=>b.disabled=d);
  function showItem(){
    busy=false; next.hidden=true; msg.textContent=''; delete next.dataset.again;
    if(idx>=order.length){
      nameEl.textContent='All done!'; box.hidden=true; svg.innerHTML=cfg.draw(null);
      msg.textContent='You got '+score+' out of '+order.length+'.';
      next.textContent='Play again'; next.dataset.again='1'; next.hidden=false; return;
    }
    box.hidden=false; setBtns(false);
    const it=order[idx]; nameEl.textContent=(it.label!==undefined?it.label:it.e+' '+it.n); svg.innerHTML=cfg.draw(it);
    scoreEl.textContent=tried?('Score: '+score+' of '+tried):'';
  }
  function guess(val){
    if(busy)return; busy=true; setBtns(true);
    const it=order[idx];
    cfg.play(it,svg,()=>{
      const right=(val===it.a); tried++; if(right)score++;
      msg.textContent=(right?'Yes! ':'Not quite. ')+cfg.say(it);
      scoreEl.textContent='Score: '+score+' of '+tried;
      next.textContent=(idx===order.length-1)?'See my score':'Next'; next.hidden=false; next.focus();
    });
  }
  next.addEventListener('click',()=>{ if(next.dataset.again==='1'){start();return;} idx++; showItem(); });
  function start(){ order=cfg.items.slice().sort(()=>Math.random()-.5); idx=0;score=0;tried=0; scoreEl.textContent=''; showItem(); }
  return start;
}

function makeStepper(id,text,draw){
  const svg=$('#'+id+'Svg'), seg=$('#'+id+'Seg'), msg=$('#'+id+'Msg'), tag=$('#'+id+'Tag'), play=$('#'+id+'Play');
  let run=0;
  function step(n){ setSeg(seg,n); svg.innerHTML=draw(n); msg.textContent=text[n][0]; tag.textContent=text[n][1]; }
  seg.addEventListener('change',()=>{ run++; play.disabled=false; step(+seg.dataset.value); });
  svg.style.cursor='pointer'; svg.addEventListener('click',()=>{ run++; play.disabled=false; step((+seg.dataset.value||0)%4+1); });
  play.addEventListener('click',()=>{
    const my=token, r=++run; let i=1; play.disabled=true;
    (function nx(){ if(my!==token||r!==run)return; step(i); i++; if(i<=4) setTimeout(nx,2800*SC+200); else setTimeout(()=>{ if(my===token&&r===run) play.disabled=false; },2800*SC+200); })();
  });

}

/* Treasure map */
const tzSvg=$('#tzSvg'), tzMsg=$('#tzMsg');
const TZ=6; let tz={px:0,py:5,tx:5,ty:0,rocks:[],steps:0,done:false};
function tzReach(){ const seen={}, q=[[tz.px,tz.py]]; seen[tz.px+','+tz.py]=1; while(q.length){ const [x,y]=q.shift(); if(x===tz.tx&&y===tz.ty) return true; [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{ const nx=x+d[0], ny=y+d[1], k=nx+','+ny; if(nx<0||ny<0||nx>=TZ||ny>=TZ||seen[k]||tz.rocks.some(r=>r[0]===nx&&r[1]===ny))return; seen[k]=1; q.push([nx,ny]); }); } return false; }
function tzSetup(){
  do{
    tz.px=Math.floor(Math.random()*2); tz.py=4+Math.floor(Math.random()*2);
    tz.tx=3+Math.floor(Math.random()*3); tz.ty=Math.floor(Math.random()*2);
    tz.rocks=[]; while(tz.rocks.length<5){ const r=[Math.floor(Math.random()*TZ),Math.floor(Math.random()*TZ)]; if((r[0]===tz.px&&r[1]===tz.py)||(r[0]===tz.tx&&r[1]===tz.ty)||tz.rocks.some(q=>q[0]===r[0]&&q[1]===r[1]))continue; tz.rocks.push(r); }
  }while(!tzReach());
  tz.steps=0; tz.done=false; tzMsg.textContent='Use North, South, East and West to reach the treasure.'; tzDraw();
}
function tzDraw(){
  const C=36, X0=12, Y0=12; let s='<rect width="300" height="260" fill="#e8dcc0"/>';
  for(let y=0;y<TZ;y++) for(let x=0;x<TZ;x++) s+='<rect x="'+(X0+x*C)+'" y="'+(Y0+y*C)+'" width="'+C+'" height="'+C+'" fill="'+((x+y)%2?'#b9d99a':'#a8cc88')+'"/>';
  tz.rocks.forEach(r=>{ s+='<rect x="'+(X0+r[0]*C+6)+'" y="'+(Y0+r[1]*C+9)+'" width="24" height="18" rx="8" fill="#8d949b" stroke="#5b6670" stroke-width="2"/>'; });
  const cx=X0+tz.tx*C, cy=Y0+tz.ty*C; s+='<rect x="'+(cx+6)+'" y="'+(cy+11)+'" width="24" height="17" rx="3" fill="#a8672d" stroke="#6b3f17" stroke-width="2"/><rect x="'+(cx+6)+'" y="'+(cy+11)+'" width="24" height="7" fill="#c98a45"/><rect x="'+(cx+15)+'" y="'+(cy+17)+'" width="6" height="7" fill="#f7c948"/>';
  const px=X0+tz.px*C+C/2, py=Y0+tz.py*C+C/2; s+='<circle cx="'+px+'" cy="'+py+'" r="14" fill="#2f7fc1" stroke="#1a5a96" stroke-width="3"/><circle cx="'+(px-5)+'" cy="'+(py-3)+'" r="2.5" fill="#fff"/><circle cx="'+(px+5)+'" cy="'+(py-3)+'" r="2.5" fill="#fff"/><path d="M'+(px-5)+' '+(py+5)+' q5 4 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>';
  s+='<g transform="translate(266 70)"><line x1="0" y1="-26" x2="0" y2="26" stroke="#10262e" stroke-width="3"/><line x1="-18" y1="0" x2="18" y2="0" stroke="#10262e" stroke-width="3"/><polygon points="0,-30 -5,-19 5,-19" fill="#d93a32"/><text x="0" y="-36" font-size="13" font-weight="700" text-anchor="middle" fill="#10262e">N</text><text x="0" y="42" font-size="13" font-weight="700" text-anchor="middle" fill="#10262e">S</text><text x="28" y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#10262e">E</text><text x="-28" y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#10262e">W</text></g>';
  tzSvg.innerHTML=s;
}
function tzMove(dx,dy,name){
  if(tz.done)return; const nx=tz.px+dx, ny=tz.py+dy;
  if(nx<0||ny<0||nx>=TZ||ny>=TZ){ tzMsg.textContent='Not yet. That is the edge of the map.'; return; }
  if(tz.rocks.some(r=>r[0]===nx&&r[1]===ny)){ tzMsg.textContent='Not yet. A rock is in the way.'; return; }
  tz.px=nx; tz.py=ny; tz.steps++; tzDraw();
  if(tz.px===tz.tx&&tz.py===tz.ty){ tz.done=true; tzMsg.textContent='You did it! You found the treasure in '+tz.steps+' steps.'; }
  else tzMsg.textContent='You walked '+name+'.';
}
$('#tzN').addEventListener('click',()=>tzMove(0,-1,'north')); $('#tzS').addEventListener('click',()=>tzMove(0,1,'south')); $('#tzW').addEventListener('click',()=>tzMove(-1,0,'west')); $('#tzE').addEventListener('click',()=>tzMove(1,0,'east'));
$('#tzNew').addEventListener('click',tzSetup);
$('#tzHint').addEventListener('click',()=>{
  if(tz.done)return; const dx=tz.tx-tz.px, dy=tz.ty-tz.py, p=[];
  if(dy<0)p.push('north'); if(dy>0)p.push('south'); if(dx>0)p.push('east'); if(dx<0)p.push('west');
  tzMsg.textContent='The treasure is '+p.join(' and ')+' of you.';
});

const vtSvg=$('#vtSvg'), segVt=$('#segVt'), vtBtns=$('#vtBtns'), vtMsg=$('#vtMsg');
const VQ={pet:['Dog','Cat','Fish'],snack:['Apple','Crackers','Cheese'],color:['Red','Blue','Green']};
let vtCounts={}, vtCelebrated={};
function vtList(){ return VQ[segVt.dataset.value]; }
function vtDraw(){
  const names=vtList(), key=segVt.dataset.value, cs=vtCounts[key], mx=Math.max(5,...cs), cols=['#2f7fc1','#e0792a','#58b564'];
  let s='<rect width="300" height="260" fill="#f4f6f8"/><line x1="20" y1="210" x2="280" y2="210" stroke="#10262e" stroke-width="3"/>';
  names.forEach((n,i)=>{ const h=cs[i]/mx*150, x=40+i*80; s+='<rect x="'+x+'" y="'+(210-h).toFixed(1)+'" width="56" height="'+h.toFixed(1)+'" rx="4" fill="'+cols[i]+'"/><text x="'+(x+28)+'" y="'+(200-h).toFixed(1)+'" font-size="20" font-weight="700" text-anchor="middle" fill="#10262e">'+cs[i]+'</text><text x="'+(x+28)+'" y="232" font-size="15" font-weight="700" text-anchor="middle" fill="#10262e">'+n+'</text>'; });
  vtSvg.innerHTML=s;
}
function vtBuild(){
  const key=segVt.dataset.value; if(!vtCounts[key]) vtCounts[key]=[0,0,0];
  vtBtns.innerHTML=''; vtList().forEach((n,i)=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=n; b.addEventListener('click',()=>{ vtCounts[key][i]++; vtDraw(); vtSay(key,n); }); vtBtns.appendChild(b); });
  vtMsg.textContent='Tap a choice to add a vote.'; vtDraw();
}
function vtSay(key,n){
  const cs=vtCounts[key], tot=cs[0]+cs[1]+cs[2], mx=Math.max.apply(null,cs), winners=vtList().filter((x,i)=>cs[i]===mx);
  const line=winners.length>1?'It is a tie right now.':winners[0]+' has the most votes. The choice with the most votes wins.';
  if(tot>=5&&!vtCelebrated[key]){ vtCelebrated[key]=true; vtMsg.textContent='You did it! You counted '+tot+' votes. '+line; }
  else vtMsg.textContent='You added a vote for '+n+'. '+line;
}
segVt.addEventListener('change',vtBuild);
$('#vtClear').addEventListener('click',()=>{ vtCounts={}; vtCelebrated={}; vtBuild(); });

const bgSvg=$('#bgSvg'), segBg=$('#segBg'), bgMsg=$('#bgMsg');

  bgSvg.innerHTML=s;
}
function bgToggle(k){
  const money=+segBg.dataset.value;
  if(bgCart[k]){ delete bgCart[k]; bgDraw(); bgMsg.textContent='You put the '+lc(BGI[k][1])+' back. You have '+(money-bgTotal())+' cents left.'; return; }

  bgCart[k]=1; bgDraw(); const left=money-bgTotal();
  bgMsg.textContent=left===0?'You did it! You spent all of your money.':'You picked the '+lc(BGI[k][1])+'. You have '+left+' cents left.';
}

const sgSvg=$('#sgSvg'), segSg=$('#segSg'), sgTotalEl=$('#sgTotal'), sgMsg=$('#sgMsg');
const SGG={car:['Toy car','🚗',30],book:['Book','📖',50],puzzle:['Puzzle','🧩',75]};
let sgTot=0, sgWeeks=0, sgDone=false;
function sgDraw(){

  let s='<rect width="300" height="260" fill="#f4efe0"/><rect x="26" y="34" width="104" height="156" rx="16" fill="rgba(255,255,255,.7)" stroke="#8a95a0" stroke-width="4"/><rect x="32" y="'+(184-h).toFixed(1)+'" width="92" height="'+h.toFixed(1)+'" rx="10" fill="#f2b632"/><text x="78" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#10262e">Savings: '+sgTot+' cents</text>';
  s+='<text x="214" y="78" font-size="62" text-anchor="middle" dominant-baseline="central">'+g[1]+'</text><text x="214" y="124" font-size="16" font-weight="700" text-anchor="middle" fill="#10262e">'+g[0]+'</text><rect x="168" y="134" width="92" height="28" rx="8" fill="#fff" stroke="#8a5f22" stroke-width="2"/><text x="214" y="148" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#10262e">Costs '+g[2]+' cents</text>';
  s+='<rect x="20" y="206" width="260" height="20" rx="10" fill="#d9dde2"/><rect x="20" y="206" width="'+(260*frac).toFixed(1)+'" height="20" rx="10" fill="#2f7fc1"/><text x="150" y="248" font-size="14" font-weight="700" text-anchor="middle" fill="#10262e">Weeks of saving: '+sgWeeks+'</text>';
  sgSvg.innerHTML=s; sgTotalEl.textContent='Goal: '+g[2]+' cents.   Saved: '+sgTot+' cents.';
}
function sgAdd(v){
  const g=SGG[segSg.dataset.value];
  if(sgDone){ sgMsg.textContent='Press Start over to save for a new goal.'; return; }
  sgTot+=v; sgWeeks++; sgDraw();
  if(sgTot>=g[2]){ sgDone=true; sgMsg.textContent='You did it! You saved '+sgTot+' cents in '+sgWeeks+(sgWeeks===1?' week.':' weeks.')+' That is enough for the '+lc(g[0])+'.'; }

}

/* My calendar */
const clSvg=$('#clSvg'), clMsg=$('#clMsg');
const CLM=['January','February','March','April','May','June','July','August','September','October','November','December'], CLW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let clY=2026, clMo=0, clSel=null;
function clDraw(){
  const first=new Date(clY,clMo,1).getDay(), days=new Date(clY,clMo+1,0).getDate(), now=new Date();
  let s='<rect width="300" height="260" fill="#fff"/><rect width="300" height="44" fill="#2f6fb2"/><text x="150" y="23" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff">'+CLM[clMo]+' '+clY+'</text>';
  CLW.forEach((w,i)=>{ s+='<text x="'+(30+i*40)+'" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#10262e">'+w.slice(0,3)+'</text>'; });
  for(let d=1;d<=days;d++){
    const idx=first+d-1, r=Math.floor(idx/7), c=idx%7, x=10+c*40, y=70+r*30;
    const today=(clY===now.getFullYear()&&clMo===now.getMonth()&&d===now.getDate());
    s+='<rect x="'+(x+1)+'" y="'+(y+1)+'" width="38" height="28" rx="6" fill="'+(clSel===d?'#2f7fc1':'#eef3f7')+'" stroke="'+(today?'#f2b632':'#d3dce3')+'" stroke-width="'+(today?4:1)+'"/><text x="'+(x+20)+'" y="'+(y+15)+'" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="'+(clSel===d?'#fff':'#10262e')+'">'+d+'</text>';
  }
  clSvg.innerHTML=s;
}
function clInfo(){ const days=new Date(clY,clMo+1,0).getDate(); clMsg.textContent='This is '+CLM[clMo]+' '+clY+'. It has '+days+' days.'; }
clSvg.style.cursor='pointer';
clSvg.addEventListener('click',e=>{
  const p=svgPt(clSvg,e), c=Math.floor((p[0]-10)/40), r=Math.floor((p[1]-70)/30); if(c<0||c>6||r<0)return;
  const first=new Date(clY,clMo,1).getDay(), days=new Date(clY,clMo+1,0).getDate(), d=r*7+c-first+1; if(d<1||d>days)return;
  clSel=d; clDraw(); const now=new Date(), today=(clY===now.getFullYear()&&clMo===now.getMonth()&&d===now.getDate());
  clMsg.textContent=CLW[new Date(clY,clMo,d).getDay()]+', '+CLM[clMo]+' '+d+', '+clY+'.'+(today?' That is today.':'');
});

const coSvg=$('#coSvg'), coQ=$('#coQ'), coMsg=$('#coMsg');
const COLAT=[60,30,0,-30,-60], COLON=[-120,-60,0,60,120];
const COX0=44, COY0=18, COW=244, COH=200;
let coT=null, coFound=0, coDone=false, coMiss=0, coPts=[];
function coXY(lon,lat){ return [COX0+(lon+180)/360*COW, COY0+(90-lat)/180*COH]; }
function coLatTxt(l){ return l===0?'0°':Math.abs(l)+'°'+(l>0?'N':'S'); }
function coLonTxt(l){ return l===0?'0°':Math.abs(l)+'°'+(l>0?'E':'W'); }
function coDraw(hint){
  let s='<rect width="300" height="260" fill="#cfe9f7"/><rect x="'+COX0+'" y="'+COY0+'" width="'+COW+'" height="'+COH+'" fill="#f4faff" stroke="#10262e" stroke-width="2"/>';
  for(let lon=-180;lon<=180;lon+=60){ const x=coXY(lon,0)[0]; s+='<line x1="'+x+'" y1="'+COY0+'" x2="'+x+'" y2="'+(COY0+COH)+'" stroke="'+(lon===0?'#2f7fc1':'#9fb7c9')+'" stroke-width="'+(lon===0?3:1.5)+'"/>'; if(lon>-180&&lon<180||true) s+='<text x="'+x+'" y="'+(COY0+COH+14)+'" font-size="10" text-anchor="middle" fill="#10262e">'+(Math.abs(lon)===180?'180°':coLonTxt(lon))+'</text>'; }
  for(let lat=-90;lat<=90;lat+=30){ const y=coXY(0,lat)[1]; s+='<line x1="'+COX0+'" y1="'+y+'" x2="'+(COX0+COW)+'" y2="'+y+'" stroke="'+(lat===0?'#2f7fc1':'#9fb7c9')+'" stroke-width="'+(lat===0?3:1.5)+'"/><text x="'+(COX0-4)+'" y="'+(y+3)+'" font-size="10" text-anchor="end" fill="#10262e">'+coLatTxt(lat)+'</text>'; }
  coPts.forEach(p=>{ const c=coXY(p[0],p[1]); s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="7" fill="#21a521" stroke="#10262e" stroke-width="2"/>'; });
  if(hint&&coT){ const c=coXY(coT[1],coT[0]); s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="16" fill="none" stroke="#f2b632" stroke-width="4" stroke-dasharray="6 5"/>'; }
  coSvg.innerHTML=s;
}
function coNext(){ let t; do{ t=[COLAT[Math.floor(Math.random()*5)],COLON[Math.floor(Math.random()*5)]]; }while(coT&&t[0]===coT[0]&&t[1]===coT[1]); coT=t; coMiss=0; coQ.textContent='Click on '+coLatTxt(t[0])+', '+coLonTxt(t[1])+'. ('+coFound+' of 5 found)'; }
coSvg.style.cursor='crosshair';
coSvg.addEventListener('click',e=>{
  if(coDone||!coT)return; const p=svgPt(coSvg,e), c=coXY(coT[1],coT[0]);

    coPts.push([coT[1],coT[0]]); coFound++; const said=coLatTxt(coT[0])+', '+coLonTxt(coT[1]);
    if(coFound>=5){ coDone=true; coDraw(false); coQ.textContent='5 of 5 found!'; coMsg.textContent='You did it! You found all 5 places on the grid.'; return; }
    coNext(); coDraw(false); coMsg.textContent='Yes! You found '+said+'. Now find the next place.';

});
