<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Social Studies</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef5f8; --ink:#10262e; --panel:#ffffff; --line:#a9c3cf; --blue:#1f6fb2; --focus:#0b4f94;
  --ok:#1d7a3a; --no:#b3402a;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a20; --ink:#eaf3f6; --panel:#172a33; --line:#3a5766; --blue:#2a7fc6; --focus:#ffd35a;
    --ok:#3fae60; --no:#e2735c; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a20; --ink:#eaf3f6; --panel:#172a33; --line:#3a5766; --blue:#2a7fc6; --focus:#ffd35a;
  --ok:#3fae60; --no:#e2735c; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Atkinson Hyperlegible',Verdana,Tahoma,system-ui,sans-serif;
  font-size:20px; line-height:1.5;
}
main{max-width:1000px;margin:0 auto;padding:24px 20px 56px}
h1{font-size:clamp(38px,7vw,60px);line-height:1.05;margin:8px 0 12px;font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(30px,5vw,42px);line-height:1.1;margin:10px 0 8px;font-weight:700}
h3{font-size:22px;margin:0 0 8px;font-weight:700}
h1:focus,h2:focus{outline:none}
p{margin:0 0 12px}
.lead{font-size:26px;margin-bottom:12px}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}

/* Home */
.gh{font-size:28px;font-weight:700;margin:30px 0 12px;padding-left:12px;border-left:10px solid var(--gc,var(--blue));line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{
  appearance:none;border:0;color:#fff;text-align:left;cursor:pointer;
  padding:20px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;
  font:inherit;border-radius:24px 24px 24px 8px;background:var(--gc);
}
.tile:nth-child(even){border-radius:24px 24px 8px 24px}
.tile:hover{filter:brightness(1.1)}
.tile .ico{font-size:56px;line-height:1}
.tile .tname{font-size:25px;font-weight:700;line-height:1.1;margin-top:14px;display:block}
.tile .tdesc{font-size:18px;display:block;margin-top:2px}
.g-space{--gc:#3b4fa3} .g-life{--gc:#2e7d3f} .g-matter{--gc:#b8432d}

/* Buttons */
.btn{
  appearance:none;font:inherit;font-weight:700;font-size:20px;cursor:pointer;
  min-height:56px;padding:10px 20px;border-radius:16px;
  background:var(--panel);color:var(--ink);border:3px solid var(--blue);
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;
}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--blue);color:#fff}
.btn.big{width:100%;min-height:64px;font-size:24px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.speak{min-width:56px;padding:6px 12px;flex:none}
.bar{margin-bottom:8px}
.say-line,.qline{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:22px}
.say-line span,.qline span{flex:1}

/* Layout */
.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:12px}
.sim.stack{grid-template-columns:1fr}
@media (max-width:760px){.sim{grid-template-columns:1fr}}
.stage{width:100%;height:auto;display:block;border:4px solid var(--line);border-radius:22px;background:#cfe9f7}
.controls{display:flex;flex-direction:column;gap:16px}
.group h3{display:flex;align-items:center;gap:8px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.seg.two2{grid-template-columns:1fr 1fr}
.seg button{
  appearance:none;font:inherit;font-weight:700;font-size:21px;cursor:pointer;min-height:60px;padding:6px 8px;
  border-radius:16px;border:3px solid var(--blue);background:var(--panel);color:var(--ink);
}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button[aria-pressed="true"]::before{content:"\2713\00a0"}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .btn{min-height:72px;font-size:26px}
.gchoices{display:grid;gap:12px}
.gchoices .btn{min-height:72px;font-size:24px}
.msg{font-size:22px;font-weight:700;min-height:2.9em;margin:0}
.objname{font-size:40px;font-weight:700;line-height:1.1}
.score{margin:0;font-size:20px}
.bigtext{font-size:34px;font-weight:700;line-height:1.1}
.tag{display:inline-block;font-size:20px;font-weight:700;padding:4px 14px;border:3px solid var(--line);border-radius:999px;background:var(--panel)}

/* Temperature */
.temp{font-size:44px;font-weight:700;line-height:1}
.state{font-size:34px;font-weight:700}
input[type=range]{width:100%;height:44px;accent-color:var(--blue)}
input[type=range]::-webkit-slider-thumb{height:36px;width:36px}
.rl{display:flex;justify-content:space-between;font-weight:700;margin-top:-6px}
.small{font-size:18px;opacity:.9}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.three .btn{padding:8px 6px;font-size:19px}

/* Table */
table.res{border-collapse:collapse;width:100%;font-size:22px}
.res th,.res td{border:3px solid var(--line);padding:8px 12px;text-align:left}
.res th{background:var(--panel)}

/* Life cycle cards */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 16px}
.slot{min-height:140px;border:4px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font-weight:700;font-size:18px;background:var(--panel)}
.slot .n{font-size:22px;opacity:.7}
.slot.filled{border-style:solid;border-color:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ccard{appearance:none;font:inherit;font-weight:700;cursor:pointer;min-height:150px;border-radius:18px;border:3px solid var(--blue);background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-size:18px}
.ccard:disabled{opacity:.25}
.ccard svg{width:76px;height:76px}
.emo{font-size:56px;line-height:1.1}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (max-width:560px){.slots,.cards{grid-template-columns:repeat(2,1fr)}}

/* Sound bars */
.sbars{display:flex;gap:10px;align-items:flex-start;height:240px;border-top:12px solid #7a4e2d;padding:0 4px}
.sbar{flex:1;appearance:none;font:inherit;font-weight:700;font-size:26px;color:#fff;border:0;border-radius:0 0 16px 16px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;transform-origin:top center}
.sbar.ring{animation:ring .5s}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}

/* Video */
.video{margin-top:32px}
.vid{margin:0 0 18px}
.vtitle{font-weight:700;font-size:20px;margin:0 0 8px}
.vframe{aspect-ratio:16/9;width:100%;background:#000;border-radius:18px;overflow:hidden;margin-bottom:10px}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vbtns{display:flex;gap:10px;flex-wrap:wrap}

/* Quiz */
.quiz{margin-top:32px;padding:22px;border:4px solid var(--line);border-radius:22px;background:var(--panel)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0}
.opts button{
  appearance:none;font:inherit;font-weight:700;font-size:22px;cursor:pointer;min-height:64px;border-radius:16px;
  border:3px solid var(--blue);background:var(--panel);color:var(--ink);
}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.no{border-color:var(--no);text-decoration:line-through}
.quiz .msg{min-height:1.5em;margin-top:6px}

details.teacher{margin-top:22px;font-size:18px}
details.teacher summary{cursor:pointer;font-weight:700;padding:8px 0}
canvas.stage{background:#f4f9fc}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important;animation:none!important} }

/* Interactivity layer */
#tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tool{min-height:44px;font-size:17px;padding:6px 14px;border-radius:14px}
.btn.small{min-height:40px;font-size:16px;padding:4px 12px;border-radius:12px}
.homebar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
#q{flex:1;min-width:220px;font:inherit;font-size:20px;padding:12px 16px;border-radius:14px;border:3px solid var(--line);background:var(--panel);color:var(--ink)}
.tile{position:relative}
.tile.done::after{content:"\2B50";position:absolute;top:10px;right:14px;font-size:30px}
.drag{touch-action:none;cursor:grab}
.chip{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;display:inline-block;padding:6px 16px;border:3px dashed var(--line);border-radius:18px;background:var(--panel)}
.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:100;padding:10px 18px;border-radius:16px;background:var(--panel);color:var(--ink);border:3px solid var(--blue);font-size:26px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.dropt{outline:4px dashed var(--focus)!important;outline-offset:2px;transform:scale(1.04)}
.pc{position:fixed;width:11px;height:11px;border-radius:3px;pointer-events:none;z-index:99;animation:pcpop .95s ease-out forwards}
@keyframes pcpop{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(420deg);opacity:0}}
details.predict{margin:12px 0;padding:10px 16px;border:3px dashed var(--line);border-radius:18px;background:var(--panel)}
details.predict summary{font-weight:700;cursor:pointer;font-size:20px;padding:4px 0}
.popts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.pv{appearance:none;font:inherit;font-weight:700;font-size:19px;cursor:pointer;min-height:52px;padding:6px 16px;border-radius:14px;border:3px solid var(--blue);background:var(--panel);color:var(--ink);display:inline-flex;gap:10px;align-items:center}
.pv .cnt{min-width:30px;padding:2px 10px;border-radius:999px;background:var(--blue);color:#fff;font-size:18px}
.hint{font-size:17px;opacity:.85;margin:0}
.nextq{align-self:flex-start}
.qprog{margin:0 0 6px;font-weight:700}
@media (prefers-reduced-motion: reduce){.pc{display:none}}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:8px}
.cat{appearance:none;border:0;text-align:left;color:#fff;background:var(--gc);border-radius:28px 28px 28px 8px;padding:22px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font:inherit}
.cat:nth-child(even){border-radius:28px 28px 8px 28px}
.cat:hover{filter:brightness(1.1)}
.cat .ico{font-size:64px;line-height:1;display:block}
.cat .cname{font-size:28px;font-weight:700;line-height:1.1;display:block;margin-top:12px}
.cat .cmeta{font-size:18px;display:block;margin:4px 0 10px}
.cat .cprog{display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
.cat .cprog i{display:block;height:100%;width:0;background:#fff}
details.sub{margin:18px 0}
details.sub summary{font-size:26px;font-weight:700;cursor:pointer;padding:6px 0 6px 12px;border-left:10px solid var(--gc,var(--blue));margin-bottom:12px}
#recent{margin:6px 0}

.topic{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 16px}
.topic .unit{margin:0 0 10px;font-size:14px;font-weight:700;opacity:.75}
.topic h3{margin:16px 0 8px;font-size:21px}
.topic .unit+h3{margin-top:0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ideas li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-size:19px;line-height:1.5}
.ideas li span{flex:1}
.ra{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.terms{margin:0;display:grid;gap:8px}
.terms div{border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.terms dt{font-weight:800;font-size:18px}
.terms dd{margin:2px 0 0;font-size:17px;line-height:1.45}
.topic .think{font-size:19px;line-height:1.5;margin:0}
@media (max-width:560px){.ideas li{flex-direction:column;gap:6px}.ra{align-self:flex-start}}
.cats .lvl{grid-column:1/-1;margin:18px 0 0;font-size:26px}
.cats .lvl:first-child{margin-top:4px}
.cats .lvlnote{grid-column:1/-1;margin:0 0 4px;font-size:17px;opacity:.85}
</style>
</head>
<body>
<main>
<div id="tools" role="toolbar" aria-label="Teacher tools">
  <button class="btn tool" id="tHome">Home</button>
  <button class="btn tool" id="tSound" aria-pressed="false">Sounds: off</button>
  <button class="btn tool" id="tCele" aria-pressed="true">Celebrations: on</button>
  <button class="btn tool" id="tSmall" aria-label="Smaller text">A-</button>
  <button class="btn tool" id="tBig" aria-label="Bigger text">A+</button>
</div>

<!-- HOME -->
<section id="home" class="view">
  <h1 tabindex="-1">Little Social Studies</h1>
  <p class="lead">Pick a level, then pick a group of activities.</p>
  <div class="homebar"><input id="q" type="search" placeholder="Search activities (try: maps, money, helpers)" aria-label="Search activities"><span id="starCount" class="tag"></span><button class="btn small" id="starReset">Reset stars</button></div>
  <div id="recent" class="homebar" hidden></div>
  <div class="homebar"><button class="btn primary" id="surprise">Surprise me with an activity</button></div>
  <div id="cats" class="cats"></div>
  <div id="results" hidden></div>
</section>

</main>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const SC=reduce?0.1:1;
let token=0;
const FIND={};
let solOrder={active:false};
let simon={active:false,playing:false,input:null,seq:[],pos:0,len:3};
function registerFinder(vid,parts,pickRaw){
  const v=document.getElementById(vid); if(!v)return;
  const seg=$('.seg',v), nm=$('.bigtext',v), ms=$('.msg',v);
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='Quiz me'; btn.style.alignSelf='flex-start';
  seg.parentNode.insertBefore(btn,seg.nextSibling);
  const F=FIND[vid]={active:false,target:null,left:[]};
  const keys=Object.keys(parts);
  function ask(){ F.target=F.left.pop(); nm.textContent='Find the '+parts[F.target][0]+'!'; ms.textContent='Tap it in the picture or press its button.'; }
  function stop(done){ F.active=false; btn.textContent='Quiz me'; if(!done){ nm.textContent='Tap a part'; ms.textContent=''; } }
  btn.addEventListener('click',()=>{ if(F.active){ stop(false); return; } F.active=true; F.left=keys.slice().sort(()=>Math.random()-.5); btn.textContent='Stop quiz'; ask(); });
  F.check=function(k){
    if(k===F.target){
      F.active=false; pickRaw(k); F.active=true;
      if(F.left.length){ ms.textContent='Yes! You found the '+parts[k][0]+'.'; setTimeout(()=>{ if(F.active) ask(); },1100); }
      else { ms.textContent='You found all the parts!'; stop(true); }
    } else { ms.textContent='Not yet. Try again.'; }
  };
  F.stop=stop;
}
const ease=u=>u*(2-u);

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener('click',e=>{
  const b=e.target.closest('.speak'); if(!b)return;
  speak(b.previousElementSibling.textContent);
});
function anim(sec,fn,done){
  const my=token,t0=performance.now();
  (function f(now){
    if(my!==token)return;
    const u=Math.min((now-t0)/(sec*1000*SC),1);
    fn(u);
    if(u<1)requestAnimationFrame(f); else if(done)done();
  })(t0);
}
function rays(cx,cy,r1,r2,n){let d='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2;d+='<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+'" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+'"/>';}return '<g stroke="#f2b632" stroke-width="4" stroke-linecap="round">'+d+'</g>';}
function sunSvg(cx,cy,r){return rays(cx,cy,r+6,r+16,12)+'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#f7c948"/>';}
function cloud(x,y,c){return '<g fill="'+c+'"><circle cx="'+x+'" cy="'+y+'" r="16"/><circle cx="'+(x+18)+'" cy="'+(y-6)+'" r="20"/><circle cx="'+(x+38)+'" cy="'+y+'" r="15"/><rect x="'+x+'" y="'+y+'" width="38" height="15"/></g>';}
const STARS=[[24,28],[260,36],[272,210],[140,236],[70,222],[270,120],[96,20],[200,18],[30,90]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.8" fill="#fff"/>').join('');

/* Segmented buttons */
function setSeg(seg,v){
  seg.dataset.value=v;
  $$('button',seg).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(v))));
}
function wireSeg(seg){ $$('button',seg).forEach(b=>b.addEventListener('click',()=>{ setSeg(seg,b.dataset.v); seg.dispatchEvent(new Event('change')); })); }

/* ---------- Build new activity views ---------- */
function addView(id,title,say,simHTML,teacher){
  const s=document.createElement('section'); s.id=id; s.className='view'; s.hidden=true;
  s.innerHTML='<div class="bar"><button class="btn back">Back to activities</button></div><h2 tabindex="-1"></h2><p class="say-line"><span></span><button class="btn speak" aria-label="Read out loud">🔊</button></p>'+simHTML+'<div class="video" data-video="'+id+'"></div><div class="quiz" data-quiz="'+id+'"></div><details class="teacher"><summary>Teacher note</summary><p></p></details>';
  $('h2',s).textContent=title; $('.say-line span',s).textContent=say; $('.teacher p',s).textContent=teacher;
  $('main').appendChild(s);
  $$('.seg',s).forEach(wireSeg);
}
const gameHTML=label=>'<div class="sim"><svg class="stage gsvg" viewBox="0 0 300 260" role="img" aria-label="'+label+'"></svg><div class="controls"><div class="objname gname"></div><div class="gchoices"></div><p class="msg gmsg" aria-live="polite"></p><button class="btn primary big gnext" hidden>Next</button><p class="score gscore"></p></div></div>';
const tapHTML=(id,parts,vb,extra,label)=>'<div class="sim"><svg id="'+id+'Svg" class="stage" viewBox="'+vb+'" role="img" aria-label="'+label+'"></svg><div class="controls"><div class="seg two2" id="'+id+'Seg">'+Object.keys(parts).map(k=>'<button data-v="'+k+'">'+parts[k][0]+'</button>').join('')+'</div>'+(extra||'')+'<div class="bigtext" id="'+id+'Name">Tap a part</div><p class="msg" id="'+id+'Msg" aria-live="polite"></p></div></div>';
const stepHTML=(id,labels,label)=>'<div class="sim"><svg id="'+id+'Svg" class="stage" viewBox="0 0 300 260" role="img" aria-label="'+label+'"></svg><div class="controls"><div class="seg two2" id="'+id+'Seg">'+labels.map((l,i)=>'<button data-v="'+(i+1)+'">'+l+'</button>').join('')+'</div><button class="btn primary big" id="'+id+'Play">Play all steps</button><p class="msg" id="'+id+'Msg" aria-live="polite"></p><div><span class="tag" id="'+id+'Tag"></span></div></div></div>';
const orderHTML=(id,labels)=>'<div class="controls" style="margin-top:12px"><div class="group"><h3>Pick a chain</h3><div class="seg" id="'+id+'Seg">'+labels.map(l=>'<button data-v="'+l[0]+'">'+l[1]+'</button>').join('')+'</div></div><div class="slots" id="'+id+'Slots"></div><div class="cards" id="'+id+'Cards"></div><p class="msg" id="'+id+'Msg" aria-live="polite"></p><button class="btn" id="'+id+'Reset">Start over</button></div>';
const CMP={school:['School','Children and teachers learn together here.'],library:['Library','You can read and borrow books here.'],park:['Park','People play, walk and rest here.'],fire:['Fire station','Firefighters work here and keep us safe.'],hospital:['Hospital','Doctors and nurses help sick or hurt people here.'],store:['Grocery store','People buy food here.']};
const MKP={house:['House','A small house shape stands for a house.'],school:['School','A building with a flag stands for a school.'],lake:['Lake','Blue stands for water.'],road:['Road','A gray line stands for a road.'],forest:['Forest','Green trees stand for a forest.']};
const CNP={na:['North America','The United States, Canada and Mexico are in North America.'],sa:['South America','Brazil and Peru are in South America. The Amazon rainforest is here.'],eu:['Europe','France, Italy and Spain are in Europe.'],af:['Africa','Egypt and Kenya are in Africa. The Sahara desert is here.'],as:['Asia','Asia is the biggest continent. China and Japan are in Asia.'],oc:['Australia','Australia is a continent and a country.'],an:['Antarctica','Antarctica is very cold. Penguins live near it.']};
const FMP={big:['A big family','Some families have many people.'],small:['A small family','Some families have just a few people.'],grand:['Grandparents and kids','Some children live with their grandparents.'],single:['One parent and kids','Some children live with one parent.'],two:['Two parents and kids','Some children live with two parents.']};

addView('helpers','Community Helpers','Who uses this to help people?',
 gameHTML('A community helper tool or place'),
 'Big idea: community helpers are people who do jobs that help everyone in a neighborhood. Words: community, helper, job, firefighter, doctor, mail carrier, teacher, police officer. Ask: How does this helper make our community safer or better? Who helps at our school? Invite a real helper to visit or video call if you can.');

addView('places','Where Would You Go?','Where in the community would you go?',
 gameHTML('A need to match with a place in the community'),
 'Big idea: our community has different places that meet different needs. Words: library, hospital, post office, grocery store, school, fire station. Ask: What other places are in our community? Walk around the school or neighborhood and name each place you see.');

addView('communitymap','Community Map','Tap a building on the map.',
 tapHTML('cm',CMP,'0 0 300 260','','A top-down map of a town with six buildings'),
 'Big idea: a map shows where places are in a community. Each place has a purpose. Words: map, building, school, library, park, fire station, hospital, store. The buildings have no names on the map on purpose, so students use their shapes and the buttons. Ask: What is each building used for? Use Quiz me to practice finding places.');

addView('rules','Why We Have Rules','Why do we have this rule?',
 gameHTML('A rule to match with its reason'),
 'Big idea: rules help keep people safe, treat people fairly, and keep places clean. Words: rule, safe, fair, clean, community. Ask: What is a rule at our school? Why do we have it? Connect to your own class rules.');

addView('fairunfair','Fair or Not Fair?','Is it fair or not fair?',
 gameHTML('A situation to sort as fair or not fair'),
 'Big idea: fairness means everyone gets a chance and is treated the same way. Words: fair, unfair, turn, share, same. Ask: How can we make it fair if something is not fair? Role-play fair and unfair situations with puppets. Keep scenarios low-stakes and avoid singling out students.');

addView('needswants','Needs and Wants','Is it a need or a want?',
 gameHTML('Something to sort as a need or a want'),
 'Big idea: needs are things we must have to live, like food, water, shelter and clothing. Wants are things that are nice to have. Words: need, want, food, water, shelter, clothing. Some items can vary by situation, such as a coat: a warm coat is a need in the cold. Ask: What do you need every day? What do you want?');

addView('goodsservices','Goods and Services','Is it a good or a service?',
 gameHTML('An item or a job to sort as a good or a service'),
 'Big idea: a good is something you can touch and buy. A service is a job someone does for you. Words: good, service, buy, sell, job. Ask: What goods and services does our school use? Who provides them?');

addView('coins','Name That Coin','Look at the coin. How much is it worth?',
 gameHTML('A U.S. coin to identify by color, size and edge'),
 'Big idea: each U.S. coin has its own value. A penny is 1 cent, a nickel is 5 cents, a dime is 10 cents and a quarter is 25 cents. Look at color, size and edge: the dime and quarter have ridged edges, and the dime is the smallest. The coins are simple drawings, so use real coins too. Words: penny, nickel, dime, quarter, cent.');

addView('coincount','Make the Amount','Tap coins to make the amount.',
 '<div class="sim"><svg id="ccSvg" class="stage" viewBox="0 0 300 260" role="img" aria-label="A pile of coins"></svg><div class="controls"><div class="group"><h3>Make</h3><div class="seg" id="segCc"><button data-v="10">10 cents</button><button data-v="25">25 cents</button><button data-v="50">50 cents</button></div></div><div class="bigtext" id="ccTotal"></div><div class="two"><button class="btn" id="ccP">Penny (1)</button><button class="btn" id="ccN">Nickel (5)</button></div><div class="two"><button class="btn" id="ccD">Dime (10)</button><button class="btn" id="ccQ">Quarter (25)</button></div><button class="btn" id="ccClear">Clear the coins</button><p class="msg" id="ccMsg" aria-live="polite"></p></div></div>',
 'Big idea: we can combine coins to make an amount of money. Words: coin, cent, total, penny, nickel, dime, quarter. There is more than one way to make an amount, so let students find different ways. Ask: Can you make the same amount with fewer coins? Start with the 10 cents goal and work up.');

addView('mapkey','Map Key','Tap a symbol on the map.',
 tapHTML('mk',MKP,'0 0 300 260','','A map with a house, school, lake, road and forest, and a map key below'),
 'Big idea: a map uses symbols, and a map key tells what each symbol means. Words: map, symbol, map key, lake, road, forest. Ask: Why do we need a map key? Draw a map of your classroom and make your own key. Use Quiz me to practice finding places.');

addView('treasure','Treasure Map','Use directions to walk to the treasure.',
 '<div class="sim"><svg id="tzSvg" class="stage" viewBox="0 0 300 260" role="img" aria-label="A grid map with a player, rocks and a treasure chest"></svg><div class="controls"><div class="two"><button class="btn" id="tzN">North</button><button class="btn" id="tzS">South</button></div><div class="two"><button class="btn" id="tzW">West</button><button class="btn" id="tzE">East</button></div><button class="btn" id="tzHint">Hint</button><button class="btn" id="tzNew">New map</button><p class="msg" id="tzMsg" aria-live="polite"></p></div></div>',
 'Big idea: directions help us find places on a map. North is up, south is down, east is right and west is left on most maps. Words: north, south, east, west, compass rose, map. Ask: Which direction did you go first? Use the compass rose on the map, and use the Hint button to practice directional words. Pair with the Directions science lab.');

addView('continents','Seven Continents','Tap a continent.',
 tapHTML('cn',CNP,'0 0 300 260','','A simple world map with seven continents'),
 'Big idea: Earth has seven continents, which are very large areas of land, surrounded by oceans. Words: continent, ocean, North America, South America, Europe, Africa, Asia, Australia, Antarctica. This is a simplified map, so use a real map or globe too. Ask: Which continent do we live on? Which is the coldest? Use Quiz me to practice.');

addView('urbanrural','City, Suburb or Country?','Where would you see this?',
 gameHTML('Something to match with a city, a suburb or the country'),
 'Big idea: communities can be urban (a city), suburban (near a city) or rural (country). Words: city, suburb, country, urban, suburban, rural. These are simplified ideas, so many places mix them. Ask: What kind of community do we live in? What do you like about it?');

addView('citizenjobs','Who Does This Job?','Who does this job in our government?',
 gameHTML('A government job to match with Congress, the President or the judges'),
 'Big idea: the United States government has three parts. Congress makes the laws, the President leads the country and carries out the laws, and judges decide if laws are fair. Words: Congress, President, judges, law, government. This is simplified. Ask: Why might it help to have three parts? Pair with the Three Branches videos.');

addView('symbols','U.S. Symbols','What symbol of the United States is this?',
 gameHTML('A symbol of the United States'),
 'Big idea: symbols are pictures or objects that stand for something important. The United States has many symbols. Words: symbol, Statue of Liberty, bald eagle, Liberty Bell, Capitol. Ask: What does each symbol stand for? What symbols does our school have? Pair with the flag and pledge routines you already use.');

addView('vote','Class Vote','Pick a question. Tap to add votes.',
 '<div class="sim"><svg id="vtSvg" class="stage" viewBox="0 0 300 260" role="img" aria-label="A bar graph of votes"></svg><div class="controls"><div class="group"><h3>Question</h3><div class="seg" id="segVt"><button data-v="pet">Favorite pet</button><button data-v="snack">Favorite snack</button><button data-v="color">Favorite color</button></div></div><div class="two" id="vtBtns"></div><button class="btn" id="vtClear">Clear the votes</button><p class="msg" id="vtMsg" aria-live="polite"></p></div></div>',
 'Big idea: in a vote, each person gets a say, and the choice with the most votes wins. Words: vote, choice, most, fewest, winner, fair. Run a real class vote: have each student tap one choice. Ask: What does it mean if there is a tie? How can voting be fair?');

addView('rights','Rights and Responsibilities','Is it a right or a responsibility?',
 gameHTML('Something to sort as a right or a responsibility'),
 'Big idea: citizens have rights, which are things we are allowed to have or do, and responsibilities, which are things we should do. Words: right, responsibility, citizen, fair, safe. Ask: What is a right you have at school? What is a responsibility? Connect to classroom jobs and routines.');

addView('dayorder','Put in Order','Tap the pictures in order. Which comes first?',
 orderHTML('do',[['day','My day'],['grow','Growing up'],['week','School week']]),
 'Big idea: events happen in an order over time. Time words help us talk about it. Words: first, next, then, last, before, after, morning, night. Ask: What did you do first today? What will you do next? Use this to build routine and sequencing skills.');

addView('thennow','Long Ago or Today?','Did people use this long ago or today?',
 gameHTML('Something to sort as long ago or today'),
 'Big idea: things change over time. Some things were used long ago, and some are used today. Words: long ago, today, past, present, change. Many items kept changing over time. Here, choose the older style or the modern style. Ask: How did people do this long ago? How do we do it today?');

addView('whoami','Who Am I?','Read the clue. Who is it?',
 gameHTML('A clue about a person from history'),
 'Big idea: some people changed history by what they did. Words: history, leader, brave, fair, first. These are short, simple clues about Martin Luther King Jr., Rosa Parks, George Washington, Abraham Lincoln and Neil Armstrong. Ask: What did this person do? How did it help people? Pair with the videos, and talk about these topics with care and age-appropriate language.');

addView('families','Families','Tap a family.',
 tapHTML('fm',FMP,'0 0 300 260','','Five different kinds of families'),
 'Big idea: families come in many shapes and sizes, and they are all special. Families care for each other. Words: family, parent, grandparent, child, care. Ask: Who is in your family? What does your family do together? Be sensitive to students’ home situations, and let students share only what they choose to.');

addView('foods','Foods Around the World','Which country is this food from?',
 gameHTML('A food to match with the country it comes from'),
 'Big idea: people in different places eat different foods, and many foods are shared across the world. Words: country, culture, food, tradition. Each food shown is just one example from the country. Ask: What foods does your family like? Try a taste test of safe, allergy-checked foods if your school allows.');

addView('greetings','Hello Around the World','Which language says hello this way?',
 gameHTML('A word for hello to match with its language'),
 'Big idea: people around the world speak different languages, and they all have ways to say hello. Words: language, hello, greeting, culture. Ask: What other ways do you know to say hello? Learn a new greeting and use it all week. Pair with Families and Foods Around the World.');

const FLP={stripes:['Stripes','There are 13 stripes. They stand for the first 13 states, called colonies.'],stars:['Stars','There are 50 stars. Each star stands for one state.'],canton:['Blue square','The blue square holds the stars. It is called the canton.']};

addView('kindness','Kind or Unkind?','Is the choice kind or unkind?',
 gameHTML('A choice to sort as kind or unkind'),
 'Big idea: kind choices help others feel safe and cared for. Words: kind, unkind, share, help, include. Ask: What could you do instead of the unkind choice? Role-play kind choices. Keep examples general so no student feels singled out. Pair with the Fair or Not Fair? and Rules activities.');

addView('caringcomm','Caring for Our Community','Does it help or hurt our community?',
 gameHTML('An action to sort as helping or hurting the community'),
 'Big idea: every person can help take care of the community by making good choices. Words: community, litter, recycle, plant, help, hurt. Ask: What is one thing we can do to help our school or neighborhood? Plan a class clean-up or a small planting project.');

addView('earnsave','Earn, Save or Spend?','Is it earning, saving or spending?',
 gameHTML('A money action to sort as earn, save or spend'),
 'Big idea: people earn money by working, save money by keeping some for later, and spend money by buying things. Words: earn, save, spend, job, bank, piggy bank. Ask: What would you like to save for? Pair with Needs and Wants and Make the Amount.');

addView('howmuch','How Much Money?','Add up the coins. How much is it?',
 gameHTML('A group of coins to add up'),
 'Big idea: we can add the values of coins to find a total. Words: penny (1), nickel (5), dime (10), quarter (25), total, cents. The coin values are written on the coins to help. Ask: How did you add them? Try counting on from the biggest coin. Pair with Name That Coin and Make the Amount.');

addView('budget','Shopping Budget','Pick what to buy. Spend all of your money without going over.',
 '<div class="sim"><svg id="bgSvg" class="stage" viewBox="0 0 300 260" role="img" aria-label="A shelf of four items with prices and a money bar"></svg><div class="controls"><div class="group"><h3>Your money</h3><div class="seg" id="segBg"><button data-v="25">25 cents</button><button data-v="50">50 cents</button></div></div><div class="two"><button class="btn" id="bgA">Apple (20)</button><button class="btn" id="bgP">Pencil (10)</button></div><div class="two"><button class="btn" id="bgS">Sticker (5)</button><button class="btn" id="bgJ">Juice (30)</button></div><button class="btn" id="bgClear">Put everything back</button><p class="msg" id="bgMsg" aria-live="polite"></p></div></div>',
 'Big idea: we have a limited amount of money, so we make choices about what to buy. Words: price, budget, cost, choose, left. With 25 cents, an apple and a sticker use all the money. With 50 cents, juice and an apple use all of it. Ask: What did you choose, and why? Pair with Needs and Wants.');

addView('makersbuyers','Makers and Buyers','Is the person a producer or a consumer?',
 gameHTML('A person to sort as a producer or a consumer'),
 'Big idea: producers make goods or provide services, and consumers buy and use them. Everyone is both a producer and a consumer at different times. Words: producer, consumer, goods, services, make, buy. Ask: What do you make? What do you buy or use? Pair with Goods and Services.');

addView('farm','From Farm to Table','Press each step to follow the food.',
 stepHTML('fa',['Farm','Truck','Store','Home'],'How food gets from a farm to a home'),
 'Big idea: food travels through many steps and many workers before we eat it. Words: farm, farmer, truck, store, grocery, home. Ask: Who helps get our food to us? Visit a grocery store or farmers market if you can, and name the workers you see. Pair with Community Helpers and Goods and Services.');

addView('mymap','Make Your Own Map','Pick a symbol. Tap a square to place it.',
 '<div class="sim"><svg id="mmSvg" class="stage drag" viewBox="0 0 300 260" role="img" aria-label="A grid where you place map symbols, with a map key below"></svg><div class="controls"><div class="group"><h3>Symbol</h3><div class="seg" id="segMm"><button data-v="house">House</button><button data-v="tree">Tree</button><button data-v="water">Water</button><button data-v="road">Road</button><button data-v="school">School</button></div></div><button class="btn" id="mmClear">Clear the map</button><p class="msg" id="mmMsg" aria-live="polite"></p></div></div>',
 'Big idea: mapmakers use symbols and a map key to show places. Words: map, symbol, map key, house, tree, water, road, school. Ask: What does your map show? Why is the key helpful? Tap the same symbol again to remove it. Have students describe their map using position and direction words. Pair with Map Key and Treasure Map.');

addView('position','Position Words','Where is the ball?',
 gameHTML('A ball above, below, beside or inside a box'),
 'Big idea: position words tell where things are. Words: above, below, beside, inside. Ask: Where is the pencil in our classroom? Practice with real objects: put a toy above, below, beside and inside a box. Pair with Treasure Map and the Directions science lab.');

addView('wholeads','Who Leads?','Is it a mayor, a governor or a president?',
 gameHTML('A leadership job to match with a mayor, a governor or a president'),
 'Big idea: our government has leaders at different levels. A mayor leads a city or town, a governor leads a state, and the President leads the whole country. Words: mayor, governor, president, city, state, country. Ask: Who is the mayor of our city? Who is our governor? Look up the names of your local leaders together.');

addView('flag','The American Flag','Tap a part of the flag.',
 tapHTML('fl',FLP,'0 0 300 260','','The American flag with stripes, stars and a blue square'),
 'Big idea: the American flag has symbols. The 13 stripes stand for the first 13 colonies, and the 50 stars stand for the 50 states. Words: flag, stripe, star, state, colony, canton. Ask: How many stars? How many stripes? Why do we have a flag? Use Quiz me to practice. Pair with U.S. Symbols and your flag routine.');

addView('holidays','National Holidays','Which holiday does the clue describe?',
 gameHTML('A clue to match with a national holiday'),
 'Big idea: we have national holidays to remember people and events that are important to our country. Words: holiday, celebrate, remember, honor. The dates of some holidays change from year to year. Ask: What holidays do we have at school? How does your family celebrate? Be sensitive to different family traditions.');

addView('transport','Through Time','Tap the pictures in order from oldest to newest.',
 orderHTML('tr',[['go','Getting around'],['msg','Sending messages']]),
 'Big idea: how people travel and communicate has changed over time. Words: long ago, then, now, newer, older, change. These orders are simplified. Many older ways, like walking, are still used today. Ask: How do you get to school? How do you talk to a friend far away? Pair with Long Ago or Today?');

addView('months','Months of the Year','Tap the months in order. Which comes first?',
 orderHTML('mo',[['a','First six months'],['b','Last six months']]),
 'Big idea: a year has twelve months in a set order. Words: month, year, January through December, calendar. Ask: What month is it? What month is your birthday? Use a classroom calendar and sing a month song. Pair with Put in Order.');

const LWP={mountain:['Mountain','A mountain is very high land.'],hill:['Hill','A hill is raised land, but it is lower than a mountain.'],river:['River','A river is water that flows across the land.'],lake:['Lake','A lake is water with land all around it.'],island:['Island','An island is land with water all around it.'],ocean:['Ocean','An ocean is a huge body of salt water.']};

addView('call911','When to Call 911','Is it an emergency? Should you call 911?',
 gameHTML('A situation to sort as a 911 emergency or not'),
 'Big idea: 911 is for emergencies, when someone needs help right away because of a fire, a serious injury, or danger. Words: emergency, 911, help, police, fire, ambulance. Practice with a toy phone and role-play, and have students know their name and address. Calling 911 as a joke can stop help from reaching someone, and remember that 911 is the number in the United States. Keep the tone calm and reassuring, and never force a student to talk about a frightening experience. Pair with Community Helpers.');

addView('roadsigns','Road Signs','What does the sign mean?',
 gameHTML('A road sign to match with its meaning'),
 'Big idea: signs use shapes, colors and pictures to give directions and keep us safe. Words: sign, stop, yield, crosswalk, do not enter. The signs here have no words on purpose, so students use shape and color. Real signs have words, so point them out on a walk. Ask: Which sign did you see on the way to school? Pair with Traffic Lights and Cross the Street Safely.');

addView('trafficlight','Traffic Lights','What does the light mean?',
 gameHTML('A traffic light color to match with its meaning'),
 'Big idea: traffic lights tell drivers and walkers when to stop, be careful, and go. Words: red, yellow, green, stop, slow down, go. For walkers, a walk signal and looking both ways are also important. Ask: What should you do when the light is red? Pair with Road Signs and Cross the Street Safely.');

addView('safety','Safety Steps','Tap the pictures in order. What do you do first?',
 orderHTML('sy',[['cross','Crossing the street'],['help','Getting help']]),
 'Big idea: safety steps happen in an order, and practicing them helps us remember. Words: stop, look, listen, walk, help, safe. Practice crossing with a floor map or in real life with a grown-up, and adapt the Getting Help steps to your school or home plan. Keep the tone calm, and never force a student to share a frightening experience.');

addView('savinggoal','Saving Goal','Pick a goal. Tap coins to save. Each tap is one week.',
 '<div class="sim"><svg id="sgSvg" class="stage" viewBox="0 0 300 260" role="img" aria-label="A jar of savings, a goal item with a price, and a progress bar"></svg><div class="controls"><div class="group"><h3>Saving for</h3><div class="seg" id="segSg"><button data-v="car">Toy car (30)</button><button data-v="book">Book (50)</button><button data-v="puzzle">Puzzle (75)</button></div></div><div class="bigtext" id="sgTotal"></div><div class="two"><button class="btn" id="sgP">Save a penny (1)</button><button class="btn" id="sgN">Save a nickel (5)</button></div><div class="two"><button class="btn" id="sgD">Save a dime (10)</button><button class="btn" id="sgQ">Save a quarter (25)</button></div><button class="btn" id="sgClear">Start over</button><p class="msg" id="sgMsg" aria-live="polite"></p></div></div>',
 'Big idea: saving means keeping some money for something we want later, and big goals take more time. Words: save, goal, week, total, price. Each tap stands for one week of saving. Ask: How can you reach the goal in fewer weeks? Which coins help most? Pair with Earn, Save or Spend? and Make the Amount.');

addView('whoiscoin','Whose Face Is It?','Which president is on the coin?',
 gameHTML('A U.S. coin to match with the president on it'),
 'Big idea: coins show faces of important people. Lincoln is on the penny, Jefferson on the nickel, Roosevelt on the dime, and Washington on the quarter. Words: president, coin, penny, nickel, dime, quarter. The coins are simple drawings, so look at real coins too. Ask: Why do you think we put presidents on coins? Pair with Name That Coin and Who Am I?');

addView('landwater','Land and Water','Tap a landform or body of water.',
 tapHTML('lw',LWP,'0 0 300 260','','A scene with a mountain, a hill, a river, a lake, an island and an ocean'),
 'Big idea: Earth has many kinds of land and water, and maps show them. Words: mountain, hill, river, lake, island, ocean. Ask: Which of these can you find near where we live? Take a walk and name the land and water you see. Use Quiz me to practice. Pair with Seven Continents and the Landforms science lab.');

addView('calendar','My Calendar','Tap a day to see its name. Use the buttons to change months.',
 '<div class="sim"><svg id="clSvg" class="stage" viewBox="0 0 300 260" role="img" aria-label="A calendar for one month"></svg><div class="controls"><div class="two"><button class="btn" id="clPrev">Last month</button><button class="btn" id="clNext">Next month</button></div><button class="btn primary" id="clToday">Go to today</button><p class="msg" id="clMsg" aria-live="polite"></p></div></div>',
 'Big idea: a calendar shows the days, weeks and months of the year. Words: calendar, day, week, month, year, today, yesterday, tomorrow. This calendar starts on today’s real date, so use it as a daily routine: find today, then say yesterday and tomorrow. Ask: What day of the week is it? What month? What is the date? Pair with Months of the Year and Put in Order.');

addView('pastpresent','Past, Present or Future?','Is it about the past, the present or the future?',
 gameHTML('A sentence to sort as past, present or future'),
 'Big idea: we talk about time as past (already happened), present (happening now) and future (will happen). Words: past, present, future, yesterday, today, tomorrow. Ask: What did you do yesterday? What are you doing now? What will you do tomorrow? Use time words in your daily routine. Pair with Put in Order and Long Ago or Today?');

addView('whoami2','Who Am I? Part 2','Read the clue. Who is it?',
 gameHTML('A clue about a person from history'),
 'Big idea: many people in history did brave and important things. Words: history, brave, first, helper, inventor, pilot. These clues are about Harriet Tubman, Helen Keller, Amelia Earhart and Benjamin Franklin. Harriet Tubman’s story includes slavery, so use age-appropriate language and be ready for questions. There is no video for Benjamin Franklin yet. Pair with Who Am I? and the videos.');

addView("wk01","Week 1: Map Tools & Spatial Reasoning","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 1.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Maps are tools that represent real places using symbols, scale, and coordinates.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>A compass rose identifies the four cardinal directions (North, South, East, West) plus intermediate directions like Northeast.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>A map key, or legend, explains what each symbol and color represents so readers can interpret information accurately.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Latitude and longitude form a global grid system that allows us to pinpoint any location on Earth using two coordinates.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Cardinal Directions</dt><dd>The four main compass points: north, south, east, and west</dd></div><div><dt>Map Legend</dt><dd>A key that explains the symbols, colors, and scale used on a map</dd></div><div><dt>Coordinates</dt><dd>A pair of numbers (latitude and longitude) that identify an exact location</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why do you think accurate maps have been essential to explorers, sailors, and travelers throughout history?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 1 deck (Unit 1: Geography & Early Civilizations). Big idea: Maps are tools that represent real places using symbols, scale, and coordinates. Words: Cardinal Directions, Map Legend, Coordinates. Think and talk: Why do you think accurate maps have been essential to explorers, sailors, and travelers throughout history? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk02","Week 2: Physical Geography & Hemispheres","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 2.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Earth&#x27;s surface is shaped by landforms such as mountains, plateaus, valleys, and plains, each formed by different natural processes.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The seven continents and five oceans cover the planet, with oceans making up about 71% of Earth&#x27;s surface.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>A hemisphere is one half of the Earth; the Equator divides the Northern and Southern Hemispheres, while the Prime Meridian divides the Eastern and Western Hemispheres.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Plateau</dt><dd>A large area of flat, elevated land</dd></div><div><dt>Equator</dt><dd>An imaginary line that divides Earth into the Northern and Southern Hemispheres</dd></div><div><dt>Prime Meridian</dt><dd>An imaginary line that divides Earth into the Eastern and Western Hemispheres</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How might living near an ocean shape a community&#x27;s economy and culture?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 2 deck (Unit 1: Geography & Early Civilizations). Big idea: Earth's surface is shaped by landforms such as mountains, plateaus, valleys, and plains, each formed by different natural processes. Words: Plateau, Equator, Prime Meridian. Think and talk: How might living near an ocean shape a community's economy and culture? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk03","Week 3: Climate Zones & Human Adaptation","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 3.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Climate refers to the average weather patterns of a region over a long period, while weather describes short-term conditions.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Climate is influenced by factors such as latitude, elevation, and proximity to water.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Human societies adapt to their climate through architecture, agriculture, clothing, and technology.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Climate</dt><dd>The long-term weather pattern typical of a region</dd></div><div><dt>Adaptation</dt><dd>A change people make to survive or thrive in their environment</dd></div><div><dt>Elevation</dt><dd>The height of land above sea level</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How might climate change affect the way people adapt to their environment in the future?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 3 deck (Unit 1: Geography & Early Civilizations). Big idea: Climate refers to the average weather patterns of a region over a long period, while weather describes short-term conditions. Words: Climate, Adaptation, Elevation. Think and talk: How might climate change affect the way people adapt to their environment in the future? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk04","Week 4: Geography & Regional Analysis","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 4.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The United States is divided into regions, such as the Northeast, South, Midwest, West, and Pacific Northwest, based on shared physical and cultural characteristics.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Each region&#x27;s geography influences its economy, from manufacturing in the Northeast to agriculture in the Midwest.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Regional identity can also be shaped by history, climate, and available natural resources.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Region</dt><dd>An area defined by common physical or human characteristics</dd></div><div><dt>Economy</dt><dd>The system by which goods and services are produced, distributed, and consumed</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How does geography shape identity and opportunity in different parts of the country?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 4 deck (Unit 1: Geography & Early Civilizations). Big idea: The United States is divided into regions, such as the Northeast, South, Midwest, West, and Pacific Northwest, based on shared physical and cultural characteristics. Words: Region, Economy. Think and talk: How does geography shape identity and opportunity in different parts of the country? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk05","Week 5: Early Human Settlement & Agriculture","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 5.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Early humans were hunter-gatherers, moving frequently in search of food, water, and shelter.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Agricultural Revolution allowed people to cultivate crops and domesticate animals, leading to permanent settlements.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Stable food supplies allowed populations to grow and enabled the development of specialized labor, trade, and early governments.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Agricultural Revolution</dt><dd>The shift from hunting and gathering to farming and raising animals</dd></div><div><dt>Domesticate</dt><dd>To tame and breed animals or plants for human use</dd></div><div><dt>Surplus</dt><dd>An amount of something greater than what is needed</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is the Agricultural Revolution considered one of the most important turning points in human history?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 5 deck (Unit 1: Geography & Early Civilizations). Big idea: Early humans were hunter-gatherers, moving frequently in search of food, water, and shelter. Words: Agricultural Revolution, Domesticate, Surplus. Think and talk: Why is the Agricultural Revolution considered one of the most important turning points in human history? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk06","Week 6: Indigenous Peoples of North America (Part 1)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 6.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Eastern Woodlands tribes lived in forested regions and relied on hunting, fishing, and farming crops such as corn, beans, and squash.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Many Eastern Woodlands groups built longhouses, which housed extended families and reflected close community ties.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Southeastern tribes developed complex societies with organized agriculture, trade networks, and sometimes large earthen mounds.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Longhouse</dt><dd>A long, narrow wooden dwelling built by several Eastern Woodlands tribes</dd></div><div><dt>Three Sisters</dt><dd>Corn, beans, and squash grown together using companion planting</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How does environment shape culture, based on what you learned this week?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 6 deck (Unit 1: Geography & Early Civilizations). Big idea: The Eastern Woodlands tribes lived in forested regions and relied on hunting, fishing, and farming crops such as corn, beans, and squash. Words: Longhouse, Three Sisters. Think and talk: How does environment shape culture, based on what you learned this week? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. Native nations are many and diverse. These regions are examples, not a full picture, and Native peoples and cultures are living today.");
addView("wk07","Week 7: Indigenous Peoples of North America (Part 2)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 7.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Plains tribes depended on the bison for food, clothing, tools, and shelter, and many followed migrating herds.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>In the arid Southwest, tribes built adobe structures suited to the dry climate and developed irrigation for farming.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Pacific Northwest tribes lived near abundant natural resources, especially salmon, and developed elaborate art and social structures.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Adobe</dt><dd>A building material made from sun-dried clay and straw</dd></div><div><dt>Irrigation</dt><dd>A method of supplying water to land to help crops grow</dd></div></dl><h3>Think and talk</h3><p class=\"think\">What does the diversity among Native American tribes teach us about adaptation to environment?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 7 deck (Unit 1: Geography & Early Civilizations). Big idea: Plains tribes depended on the bison for food, clothing, tools, and shelter, and many followed migrating herds. Words: Adobe, Irrigation. Think and talk: What does the diversity among Native American tribes teach us about adaptation to environment? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. Native nations are many and diverse. These regions are examples, not a full picture, and Native peoples and cultures are living today.");
addView("wk08","Week 8: Exploration & Early Contact","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 8.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>During the Age of Exploration, European nations sent explorers to find new trade routes, resources, and territory.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Motives are often summarized as &#x27;God, Gold, and Glory&#x27;: spreading religion, gaining wealth, and achieving fame.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Early contact between Europeans and Native Americans led to trade, conflict, and lasting cultural change.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Age of Exploration</dt><dd>A period when European nations explored and colonized distant lands</dd></div><div><dt>Motive</dt><dd>A reason for doing something</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Whose perspective is often missing when we tell the story of exploration, and why does that matter?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 8 deck (Unit 1: Geography & Early Civilizations). Big idea: During the Age of Exploration, European nations sent explorers to find new trade routes, resources, and territory. Words: Age of Exploration, Motive. Think and talk: Whose perspective is often missing when we tell the story of exploration, and why does that matter? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes conflict and the loss of Native lands. Preview the deck, use age-appropriate language, and make space for the perspectives that are often left out.");
addView("wk09","Week 9: The Columbian Exchange","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 9.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Columbian Exchange was the widespread transfer of plants, animals, people, and diseases between the Eastern and Western Hemispheres after 1492.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Crops like potatoes and corn transformed diets in Europe, while horses and cattle changed life in the Americas.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Diseases such as smallpox devastated Native American populations, who had no immunity, resulting in demographic catastrophe.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Columbian Exchange</dt><dd>The transfer of goods, ideas, and diseases between hemispheres after Columbus&#x27;s voyages</dd></div><div><dt>Immunity</dt><dd>The body&#x27;s ability to resist a disease</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Was the Columbian Exchange more beneficial or harmful overall? Support your answer with evidence.</p></div>"+gameHTML("A definition to match with its word"),"From your Week 9 deck (Unit 1: Geography & Early Civilizations). Big idea: The Columbian Exchange was the widespread transfer of plants, animals, people, and diseases between the Eastern and Western Hemispheres after 1492. Words: Columbian Exchange, Immunity. Think and talk: Was the Columbian Exchange more beneficial or harmful overall? Support your answer with evidence. Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes disease and the deaths of many Native Americans. Preview the deck and use calm, age-appropriate language.");
addView("wk10","Week 10: Unit 1 Capstone & Synthesis","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 1: Geography &amp; Early Civilizations. Week 10.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>This unit explored how geography, climate, and natural resources shaped where and how people lived.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>You studied Indigenous cultures, early explorers, and the consequences of contact between hemispheres.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Now you&#x27;ll synthesize what you&#x27;ve learned into a final reflection.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Synthesize</dt><dd>To combine different ideas or pieces of information into a whole</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How does understanding early history help us make sense of the world today?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 10 deck (Unit 1: Geography & Early Civilizations). Big idea: This unit explored how geography, climate, and natural resources shaped where and how people lived. Words: Synthesize. Think and talk: How does understanding early history help us make sense of the world today? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk11","Week 11: The Thirteen Colonies (New England)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 11.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>New England colonies, including Massachusetts, Connecticut, Rhode Island, and New Hampshire, were settled largely by Puritans seeking religious freedom.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Rocky soil and a short growing season led colonists to rely on fishing, shipbuilding, and trade rather than large-scale farming.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Town meetings gave New England communities early experience with self-government and civic participation.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Puritan</dt><dd>A Protestant group that sought to &#x27;purify&#x27; the Church of England and settled in New England</dd></div><div><dt>Self-Government</dt><dd>The ability of a community to govern itself</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How did New England&#x27;s environment and religious values shape its unique colonial identity?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 11 deck (Unit 2: Colonies & Revolution). Big idea: New England colonies, including Massachusetts, Connecticut, Rhode Island, and New Hampshire, were settled largely by Puritans seeking religious freedom. Words: Puritan, Self-Government. Think and talk: How did New England's environment and religious values shape its unique colonial identity? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk12","Week 12: The Thirteen Colonies (Middle Colonies)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 12.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Middle Colonies, New York, New Jersey, Pennsylvania, and Delaware, were known for fertile soil and diverse populations.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Because of abundant wheat production, the Middle Colonies earned the nickname &#x27;the Breadbasket Colonies.&#x27;</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Religious tolerance and a mix of cultures, including Dutch, German, and English settlers, made this region especially diverse.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Breadbasket</dt><dd>A region known for producing large amounts of grain</dd></div><div><dt>Religious Tolerance</dt><dd>Accepting people of different religious beliefs</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why might diversity have made the Middle Colonies more economically successful?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 12 deck (Unit 2: Colonies & Revolution). Big idea: The Middle Colonies, New York, New Jersey, Pennsylvania, and Delaware, were known for fertile soil and diverse populations. Words: Breadbasket, Religious Tolerance. Think and talk: Why might diversity have made the Middle Colonies more economically successful? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk13","Week 13: The Thirteen Colonies (Southern Colonies)","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 13.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The Southern Colonies, Virginia, Georgia, and the Carolinas, had a warm climate ideal for cash crops like tobacco, rice, and cotton.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Plantation agriculture depended heavily on the forced labor of enslaved Africans, a system that caused immense suffering and shaped the region&#x27;s economy for generations.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Wealth and social status in the South were often tied to land ownership and plantation size.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Plantation</dt><dd>A large farm, especially in warm climates, that grows cash crops</dd></div><div><dt>Cash Crop</dt><dd>A crop grown specifically to sell for profit</dd></div></dl><h3>Think and talk</h3><p class=\"think\">Why is it important to understand both the economic success and the human suffering tied to plantation agriculture?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 13 deck (Unit 2: Colonies & Revolution). Big idea: The Southern Colonies, Virginia, Georgia, and the Carolinas, had a warm climate ideal for cash crops like tobacco, rice, and cotton. Words: Plantation, Cash Crop. Think and talk: Why is it important to understand both the economic success and the human suffering tied to plantation agriculture? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas. This topic includes slavery and the suffering of enslaved people. Preview the deck, use respectful language, and let students step back if they need to.");
addView("wk14","Week 14: Colonial Self-Governance","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 14.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>Even before independence, colonists practiced self-governance through documents and institutions like the Mayflower Compact and the Virginia House of Burgesses.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The Mayflower Compact (1620) was an early agreement establishing rules for self-government based on majority rule.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The House of Burgesses (1619) became the first elected legislative body in the American colonies.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Compact</dt><dd>A formal agreement between people or groups</dd></div><div><dt>Legislative Body</dt><dd>A group of people with the power to make laws</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How did early self-governing institutions lay the foundation for American democracy?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 14 deck (Unit 2: Colonies & Revolution). Big idea: Even before independence, colonists practiced self-governance through documents and institutions like the Mayflower Compact and the Virginia House of Burgesses. Words: Compact, Legislative Body. Think and talk: How did early self-governing institutions lay the foundation for American democracy? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
addView("wk15","Week 15: The French and Indian War","Read the key ideas. Then match each meaning to its word.","<div class=\"topic\"><p class=\"unit\">Unit 2: Colonies &amp; Revolution. Week 15.</p><h3>Key ideas</h3><ol class=\"ideas\"><li><span>The French and Indian War (1754 to 1763) was fought between Britain and France, each allied with different Native American nations, for control of North American territory.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>Britain won the war but incurred enormous debt, which it attempted to repay by taxing the American colonies.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li><li><span>The war also strained relationships between Britain and the colonies, as colonists resented British restrictions on westward expansion.</span><button class=\"ra\" type=\"button\" aria-label=\"Read this idea aloud\">Read to me</button></li></ol><p><button class=\"ra\" type=\"button\" data-all=\"1\">Read all the key ideas to me</button></p><h3>Word bank</h3><dl class=\"terms\"><div><dt>Alliance</dt><dd>A partnership formed for mutual benefit, especially in war</dd></div><div><dt>Debt</dt><dd>Money that is owed</dd></div></dl><h3>Think and talk</h3><p class=\"think\">How can winning a war still create serious problems for the victor?</p></div>"+gameHTML("A definition to match with its word"),"From your Week 15 deck (Unit 2: Colonies & Revolution). Big idea: The French and Indian War (1754 to 1763) was fought between Britain and France, each allied with different Native American nations, for control of North American territory. Words: Alliance, Debt. Think and talk: How can winning a war still create serious problems for the victor? Use the Read to me buttons for students who benefit from hearing the text. The word game matches each definition to its word, and the quiz and predict poll follow the same ideas.");
