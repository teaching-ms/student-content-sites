inits["xs_landmarks"]=revealGame({id:"xs_landmarks",cols:2,choices:[["africa", "Africa"], ["samerica", "South America"], ["asia", "Asia"], ["europe", "Europe"], ["oceania", "Australia"], ["namerica", "North America"]],items:[["Clue", "🗺️", "africa", "The Nile River", "The Nile flows through northeastern Africa."], ["Clue", "🗺️", "samerica", "The Amazon River", "The Amazon is in South America."], ["Clue", "🗺️", "asia", "The Himalayas", "The Himalayas are in Asia."], ["Clue", "🗺️", "europe", "The Alps", "The Alps are in Europe."], ["Clue", "🗺️", "oceania", "The Great Barrier Reef", "The reef is off the coast of Australia."], ["Clue", "🗺️", "namerica", "The Rocky Mountains", "The Rockies are in North America."]],say:function(it){return it.x||('That is '+it.al+'.');}});
const FX={sound:false,cele:true,zoom:1};
const STAR={};
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
(function(){ const f=lsGet('sss_fx'); if(f){ FX.sound=!!f.sound; FX.cele=f.cele!==false; FX.zoom=f.zoom||1; } const s=lsGet('sss_stars'); if(s) Object.keys(s).forEach(k=>STAR[k]=1); })();
let fxCtx=null;
function beep(freqs,dur,vol){
  if(!FX.sound)return;
  try{
    fxCtx=fxCtx||new (window.AudioContext||window.webkitAudioContext)(); if(fxCtx.state==='suspended')fxCtx.resume();
    freqs.forEach((f,i)=>{ const o=fxCtx.createOscillator(), g=fxCtx.createGain(), t=fxCtx.currentTime+i*dur; o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(fxCtx.destination); o.start(t); o.stop(t+dur+0.03); });
  }catch(e){}
}
function confetti(el,n){
  if(!FX.cele||reduce)return;
  const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const cx=r.left+r.width/2, cy=r.top+Math.min(r.height,40)/2, cols=['#f7c948','#e0604a','#2f7fc1','#58b564','#c9a0e8'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='pc'; d.style.left=cx+'px'; d.style.top=cy+'px'; d.style.background=cols[i%cols.length];
    const a=Math.random()*Math.PI*2, m=60+Math.random()*110; d.style.setProperty('--dx',(Math.cos(a)*m).toFixed(0)+'px'); d.style.setProperty('--dy',(Math.sin(a)*m-30).toFixed(0)+'px');
    document.body.appendChild(d); setTimeout(()=>d.remove(),1000);
  }
}
function fxGood(el){ beep([660,880],0.13); confetti(el,18); }
function fxBig(el){ beep([523,659,784,1047],0.12,0.12); confetti(el,44); }
function fxBad(el){ beep([260],0.2,0.07); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }

/* Stars */
function updateStars(){
  $$('.tile').forEach(t=>t.classList.toggle('done',!!STAR[t.dataset.go]));
  const n=ACTS.filter(a=>STAR[a[0]]).length, sc=$('#starCount'); if(sc) sc.textContent='\u2B50 '+n+' of '+ACTS.length+' done';
  TOPICS.forEach(c=>{
    const ids=[].concat.apply([],c.subs.map(x=>x[1])), d=ids.filter(id=>STAR[id]).length, card=$('.cat[data-cat="'+c.id+'"]');
    if(card){ $('.cmeta',card).textContent=ids.length+' activities, '+d+' done'; $('.cprog i',card).style.width=(100*d/ids.length)+'%'; }
  });
}
function star(id){ if(!id||STAR[id])return; STAR[id]=1; lsSet('sss_stars',STAR); updateStars(); }
$('#starReset').addEventListener('click',()=>{ Object.keys(STAR).forEach(k=>delete STAR[k]); lsSet('sss_stars',STAR); updateStars(); });
updateStars();

/* Watch every message line: celebrate right answers, shake wrong ones, award stars */
const msgObs=new MutationObserver(list=>{
  const seen=new Set();
  list.forEach(m=>{
    const el=m.target; if(!el||!el.classList||!el.classList.contains('msg')||seen.has(el))return; seen.add(el);
    const tx=el.textContent.trim(); if(!tx)return; const v=el.closest('.view');
    if(/^(You got|You did it|You found)/.test(tx)){ fxBig(el); if(v)star(v.id); }
    else if(/^Yes/.test(tx)){ fxGood(el); if(el.closest('.quiz')&&/finished the quiz/.test(tx)&&v) star(v.id); }
    else if(/^(Not yet|Not quite)/.test(tx)){ fxBad(el); }
  });
});
msgObs.observe($('main'),{childList:true,subtree:true});

/* Teacher tools */
function applyTools(){
  $('#tSound').textContent='Sounds: '+(FX.sound?'on':'off'); $('#tSound').setAttribute('aria-pressed',String(FX.sound));
  $('#tCele').textContent='Celebrations: '+(FX.cele?'on':'off'); $('#tCele').setAttribute('aria-pressed',String(FX.cele));
  try{ document.body.style.zoom=FX.zoom; }catch(e){}
  lsSet('sss_fx',FX);
}
$('#tSound').addEventListener('click',()=>{ FX.sound=!FX.sound; applyTools(); if(FX.sound) beep([660,880],0.13); });
$('#tCele').addEventListener('click',()=>{ FX.cele=!FX.cele; applyTools(); if(FX.cele) confetti($('#tCele'),16); });
$('#tSmall').addEventListener('click',()=>{ FX.zoom=Math.max(0.9,+(FX.zoom-0.15).toFixed(2)); applyTools(); });
$('#tBig').addEventListener('click',()=>{ FX.zoom=Math.min(1.6,+(FX.zoom+0.15).toFixed(2)); applyTools(); });
$('#tHome').addEventListener('click',()=>show('home'));
applyTools();

/* Search */
$('#q').addEventListener('input',()=>{
  const q=$('#q').value.trim().toLowerCase(), res=$('#results'), cats=$('#cats'), rec=$('#recent');
  if(!q){ res.hidden=true; cats.hidden=false; renderRecent(); return; }
  cats.hidden=true; rec.hidden=true; res.hidden=false; res.innerHTML='';
  const hits=ACTS.filter(a=>(a[2]+' '+a[3]+' '+(CATN[catOf[a[0]]]||'')).toLowerCase().indexOf(q)>=0);
  if(!hits.length){ const p=document.createElement('p'); p.textContent='No activities found. Try another word.'; res.appendChild(p); return; }
  const grid=document.createElement('div'); grid.className='tiles'; hits.forEach(a=>grid.appendChild(mkTile(a))); res.appendChild(grid); updateStars();
});

Object.keys(PRED).forEach(id=>{
  const v=document.getElementById(id); if(!v)return;
  const q=PRED[id][0], opts=PRED[id][1];
  const d=document.createElement('details'); d.className='predict'; d.open=true;
  d.innerHTML='<summary></summary><div class="popts"></div><button class="btn small clr">Clear votes</button>';
  $('summary',d).textContent='Predict first: '+q;
  const box=$('.popts',d), cnts=[];
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='pv'; b.innerHTML='<span class="lbl"></span><span class="cnt">0</span>'; $('.lbl',b).textContent=o;
    const c=$('.cnt',b); cnts.push(c); b.addEventListener('click',()=>{ c.textContent=(+c.textContent)+1; beep([520],0.08,0.06); });
    box.appendChild(b);
  });
  $('.clr',d).addEventListener('click',()=>cnts.forEach(c=>c.textContent='0'));
  const sl=$('.say-line',v); sl.parentNode.insertBefore(d,sl.nextSibling);
});

Object.keys(HINTS).forEach(id=>{ const v=document.getElementById(id); if(!v)return; const c=$('.controls',v); if(!c)return; const p=document.createElement('p'); p.className='hint'; p.textContent=HINTS[id]; c.appendChild(p); });
$$('.gname').forEach(el=>{ const c=el.parentNode, p=document.createElement('p'); p.className='hint'; p.textContent='Tip: drag the card onto an answer, or tap an answer.'; c.insertBefore(p,el.nextSibling); });

/* Read-aloud on every message line */
$$('.view .controls .msg').forEach(m=>{ const b=document.createElement('button'); b.className='btn speak small'; b.setAttribute('aria-label','Read out loud'); b.style.alignSelf='flex-start'; b.textContent='\uD83D\uDD0A'; m.parentNode.insertBefore(b,m.nextSibling); });

/* ---------- Drag helpers ---------- */
function svgPt(svg,e){
  const r=svg.getBoundingClientRect(), vb=(svg.viewBox&&svg.viewBox.baseVal)||{width:300,height:260};
  return [(e.clientX-r.left)*vb.width/(r.width||vb.width),(e.clientY-r.top)*vb.height/(r.height||vb.height)];
}
function dragOn(svg,onMove,onEnd){
  svg.classList.add('drag');
  svg.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    if(onMove(svgPt(svg,e),true)===false)return;
    const mv=ev=>onMove(svgPt(svg,ev),false);
    const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); if(onEnd)onEnd(); };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
    if(e.preventDefault)e.preventDefault();
  });
}
function startDrag(e,src,onDrop,hlSel){
  if(e.button!==undefined&&e.button!==0)return;
  const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false, hl=null;
  const under=(x,y)=>{ const t=document.elementFromPoint?document.elementFromPoint(x,y):null; return t; };
  const mv=ev=>{
    if(!moved){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return; moved=true; ghost=document.createElement('div'); ghost.className='ghost'; ghost.textContent=src.textContent; document.body.appendChild(ghost); }
    ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
    const t=under(ev.clientX,ev.clientY), b=t&&t.closest?t.closest(hlSel):null;
    if(hl&&hl!==b)hl.classList.remove('dropt'); hl=b; if(b)b.classList.add('dropt');
    if(ev.preventDefault)ev.preventDefault();
  };
  const up=ev=>{
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    if(hl)hl.classList.remove('dropt'); if(ghost)ghost.remove();
    if(moved) onDrop(under(ev.clientX,ev.clientY));
  };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
function chipDrag(el,sel){
  el.classList.add('chip');
  el.addEventListener('pointerdown',e=>startDrag(e,el,t=>{ const b=t&&t.closest?t.closest(sel):null; if(b&&!b.disabled)b.click(); },sel));
}
$$('.gname').forEach(el=>chipDrag(el,'.gchoices button'));
if($('#sfName')) chipDrag($('#sfName'),'#sfGuess button');
['doCards','trCards','moCards','syCards','tlCards','spCards','sqCards'].forEach(id=>{
  const c=document.getElementById(id); if(!c)return;
  c.addEventListener('pointerdown',e=>{ const card=e.target.closest('.ccard'); if(!card||card.disabled)return; startDrag(e,card,t=>{ const s=t&&t.closest?t.closest('.slot'):null; if(s)card.click(); },'.slot'); });
});
function cycleSeg(seg,vals){ const i=vals.indexOf(String(seg.dataset.value)); const v=vals[(i+1)%vals.length]; setSeg(seg,v); seg.dispatchEvent(new Event('change')); }
updateStars();
$('#surprise').addEventListener('click',()=>{ const pool=ACTS.filter(a=>!STAR[a[0]]), list=pool.length?pool:ACTS; show(list[Math.floor(Math.random()*list.length)][0]); });
renderRecent();
$('#home h1').focus({preventScroll:true});
})();
</script>
