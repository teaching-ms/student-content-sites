body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;font-size:18px;line-height:1.45}

.foot{margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px}

function distractors(f,n){
  const out=[],seen={}; seen[f.a.toLowerCase()]=1; const text=f.full.toLowerCase();
  (f.d||[]).forEach(x=>{ const l=x.toLowerCase(); if(!seen[l]){ seen[l]=1; out.push(x); } });
  if(out.length<n){
    const sameUnit=BYKIND[f.k].filter(g=>g.unit===f.unit), sameTrack=BYKIND[f.k].filter(g=>TRACKOF(g.unit)===TRACKOF(f.unit)), all=BYKIND[f.k];
    [sameUnit,sameTrack,all].forEach(pool=>{ shuffle(pool).forEach(g=>{ if(out.length>=n) return; const l=g.a.toLowerCase(); if(seen[l]||text.indexOf(l)>=0) return; seen[l]=1; out.push(g.a); }); });
  }
  return shuffle(out).slice(0,n);
}

function tfFact(f){ const ds=distractors(f,1); const truth=Math.random()<0.5||!ds.length; const stmt=truth?f.full:f.pre+ds[0]+f.post; return {fid:f.id,unit:f.unit,text:stmt,sub:'True or false?',choices:['True','False'],fixed:true,correct:truth?'True':'False',expl:truth?f.full:'False. The true statement is: '+f.full}; }
function mcHQ(h,i){ return {fid:null,unit:h[0],text:h[1],sub:'Choose the best answer.',choices:shuffle([h[2]].concat(h[3])),correct:h[2],expl:h[4]}; }

    (DATA.unitExtras[uid]||[]).forEach(id=>{ const s=SORTS[id],o=ORDERS[id]; if(s) acts.push([id,s.title,'Sort the items',()=>runSort(id,()=>renderUnit(uid))]); if(o) acts.push([id,o.title,'Put it in order',()=>runOrder(id,()=>renderUnit(uid))]); });
    acts.forEach(a=>{ const b=el('button','tile'); b.type='button'; b.style.setProperty('--tc',col); b.appendChild(el('b',null,a[1])); b.appendChild(el('span',null,a[2])); b.appendChild(el('span','pg',P.stars[uid+':'+a[0]]>=80?'Star earned':'')); b.addEventListener('click',a[3]); grid.appendChild(b); });
    root.appendChild(grid);
    root.appendChild(el('h2',null,'Study guide'));
    const opts=el('div','opts'); const lab=el('label'); const cb=el('input'); cb.type='checkbox'; lab.appendChild(cb); lab.appendChild(document.createTextNode(' Cover the answers (tap to peek)')); opts.appendChild(lab);
    const ra=el('button','small','Read all to me'); ra.type='button'; ra.addEventListener('click',()=>speak(u.facts.map(f=>f.full).join(' '))); opts.appendChild(ra); root.appendChild(opts);
    const ul=el('ul','guide');
    u.facts.forEach(f=>{ const li=el('li'); const sp=el('span'); sp.appendChild(document.createTextNode(f.pre)); const b=el('b',null,f.a); b.addEventListener('click',()=>{ if(ul.classList.contains('cover')) b.classList.toggle('show'); }); sp.appendChild(b); sp.appendChild(document.createTextNode(f.post)); li.appendChild(sp); const h=el('button','small','Hear it'); h.type='button'; h.addEventListener('click',()=>speak(f.full)); li.appendChild(h); ul.appendChild(li); });
    cb.addEventListener('change',()=>{ ul.classList.toggle('cover',cb.checked); ul.querySelectorAll('b').forEach(b=>b.classList.remove('show')); });

}

/* ---------- quiz engine (also used for true/false, sorting, and the practice test) ---------- */
function recordWeak(q,firstTry){ if(!q.fid) return; if(firstTry) delete P.weak[q.fid]; else P.weak[q.fid]=1; }
function runQuiz(o){
  const qs=o.qs; if(!qs.length){ view(r=>{ r.appendChild(el('p',null,'There are no questions here yet.')); const b=el('button','btn','Back'); b.type='button'; b.addEventListener('click',o.back); r.appendChild(b); }); return; }
  const res={total:qs.length,first:0,missed:[],byUnit:{},answers:[]}; let i=0;
  view(root=>{
    const tb=el('div','topbar'); tb.appendChild(el('h2',null,o.title)); const bk=el('button','btn alt',o.backLabel||'Back'); bk.type='button'; bk.addEventListener('click',o.back); tb.appendChild(bk); root.appendChild(tb);
    const panel=el('div','panel'); root.appendChild(panel); panel.setAttribute('aria-live','polite');
    function show(){
      panel.innerHTML=''; const q=qs[i]; q.misses=0; q.done=false;
      const pr=el('div','prog'); pr.appendChild(el('span',null,'Question '+(i+1)+' of '+qs.length)); const bar=el('div','bar'); const fill=el('i'); fill.style.width=(i/qs.length*100)+'%'; bar.appendChild(fill); pr.appendChild(bar); panel.appendChild(pr);
      if(q.tag) panel.appendChild(el('p','qsub',q.tag));
      panel.appendChild(el('div','qtext',q.text));
      const hb=el('button','small','Hear it'); hb.type='button'; hb.style.display='block'; hb.style.margin='4px auto'; hb.addEventListener('click',()=>speak(q.text.replace(/_____/g,'blank'))); panel.appendChild(hb);
      panel.appendChild(el('p','qsub',q.sub||''));
      const box=el('div','choices'+(q.choices.length===2?' two':'')); panel.appendChild(box);
      const msg=el('div','msg'); msg.setAttribute('role','status'); panel.appendChild(msg);
      const act=el('div','actions'); panel.appendChild(act);
      const btns=[]; const list=q.fixed?q.choices:q.choices;
      list.forEach(c=>{ const b=el('button','choice',c); b.type='button'; btns.push([b,c]); box.appendChild(b);
        b.addEventListener('click',()=>{
          if(q.done) return;
          if(o.mode==='test'){ q.picked=c; btns.forEach(x=>x[0].classList.remove('sel')); b.classList.add('sel'); if(!act.firstChild){ const n=el('button','btn',i+1<qs.length?'Next':'Finish'); n.type='button'; n.addEventListener('click',()=>finishQ(q,q.picked===q.correct,false,null)); act.appendChild(n); } return; }
          if(c===q.correct){ finishQ(q,true,true,{btns,b,msg,act}); }
          else { q.misses++; b.classList.add('miss'); b.disabled=true; msg.textContent='Not yet. Try again.'; if(q.misses>=2&&!act.firstChild){ const s=el('button','btn alt','Show me'); s.type='button'; s.addEventListener('click',()=>finishQ(q,false,true,{btns,b:null,msg,act,reveal:true})); act.appendChild(s); } }
        });
      });
      function finishQ(q,correct,feedback,ui){
        const first=correct&&q.misses===0; q.done=true; res.answers.push({q,first});
        if(first) res.first++; else res.missed.push(q);
        const bu=res.byUnit[q.unit]=res.byUnit[q.unit]||{n:0,c:0}; bu.n++; if(first) bu.c++;
        recordWeak(q,first);
        if(feedback&&ui){ btns.forEach(x=>{ x[0].disabled=true; if(x[1]===q.correct) x[0].classList.add('ok'); }); ui.msg.textContent=(ui.reveal||!correct?'Here it is. ':'Yes! ')+q.expl; ui.act.innerHTML=''; const n=el('button','btn',i+1<qs.length?'Next':'See my score'); n.type='button'; n.addEventListener('click',next); ui.act.appendChild(n); n.focus(); }
        else next();
      }
    }
    function next(){ i++; if(i<qs.length) show(); else done(); }
    function done(){
      const pct=Math.round(res.first/res.total*100); save(); if(o.key) award(o.key,pct);
      panel.innerHTML=''; const e=el('div','end'); e.appendChild(el('h3',null,o.mode==='test'?'Test results':'Round complete!'));
      e.appendChild(el('p',null,'You got '+res.first+' of '+res.total+' right on the first try ('+pct+'%).'));
      if(o.key&&pct>=80) e.appendChild(el('p',null,'You earned a star for this activity.'));
      if(Object.keys(res.byUnit).length>1){ const tbl=el('table','bu'); const hr=el('tr'); ['Unit','Correct'].forEach(h=>hr.appendChild(el('th',null,h))); tbl.appendChild(hr); Object.keys(res.byUnit).forEach(u=>{ const tr=el('tr'); tr.appendChild(el('td',null,UNITBY[u].title)); tr.appendChild(el('td',null,res.byUnit[u].c+' of '+res.byUnit[u].n)); tbl.appendChild(tr); }); e.appendChild(tbl); }
      if(res.missed.length){ e.appendChild(el('p',null,'Questions to review:')); const ml=el('div','miss-list'); res.missed.forEach(q=>{ const d=el('div'); d.appendChild(el('b',null,q.text)); d.appendChild(el('div',null,'Answer: '+q.correct+'. '+q.expl)); ml.appendChild(d); }); e.appendChild(ml); }
      const a=el('div','actions'); const redo=el('button','btn',res.missed.length?'Try the missed ones':'Play again'); redo.type='button';
      redo.addEventListener('click',()=>{ if(res.missed.length){ runQuiz(Object.assign({},o,{qs:res.missed.map(q=>Object.assign({},q,{misses:0,done:false,picked:null})),key:null,title:'Review: '+o.title})); } else if(o.again) o.again(); else o.back(); });
      a.appendChild(redo); if(o.again&&res.missed.length){ const ag=el('button','btn alt','New round'); ag.type='button'; ag.addEventListener('click',o.again); a.appendChild(ag); }
      const hm=el('button','btn alt',o.backLabel||'Back'); hm.type='button'; hm.addEventListener('click',o.back); a.appendChild(hm); e.appendChild(a); panel.appendChild(e); redo.focus();
    }
    show();
  });
}

/* ---------- sorting game ---------- */
function runSort(id,back){
  const s=SORTS[id];
  function go(){
    const items=shuffle(s.items).slice(0,10); const key=s.unit+':'+s.id;
    const qs=items.map(it=>({fid:null,unit:s.unit,tag:'Sort it: '+s.title,text:it[0],sub:'Which one fits?',choices:s.buckets.slice(),fixed:true,correct:s.buckets[it[1]],expl:it[2]}));
    runQuiz({title:s.title,qs,back,key,again:go});
  }
  go();
}

/* ---------- ordering game (also the Preamble builders) ---------- */
function runOrder(id,back){
  const o=ORDERS[id]; const key=o.unit+':'+o.id;
  view(root=>{
    const tb=el('div','topbar'); tb.appendChild(el('h2',null,o.title)); const bk=el('button','btn alt','Back'); bk.type='button'; bk.addEventListener('click',back); tb.appendChild(bk); root.appendChild(tb);
    const panel=el('div','panel'); root.appendChild(panel); panel.setAttribute('aria-live','polite');
    let placed=0,misses=0,hinted=false;
    panel.appendChild(el('p','qsub',o.intro+' Tap the item that comes next.'));
    const slots=el('div','slots'); panel.appendChild(slots);
    const slotEls=o.items.map((it,k)=>{ const s=el('div','slot'); s.appendChild(el('span','n',String(k+1)+'.')); const t=el('span','t',''); s.appendChild(t); slots.appendChild(s); return s; });
    const msg=el('div','msg'); msg.setAttribute('role','status'); panel.appendChild(msg);
    const bank=el('div','bank'); panel.appendChild(bank);
    const order=shuffle(o.items.map((it,k)=>k));
    order.forEach(k=>{ const b=el('button','choice',o.items[k][0]); b.type='button';
      b.addEventListener('click',()=>{
        if(k===placed){ const s=slotEls[placed]; s.classList.add('filled'); $('.t',s).textContent=o.items[k][0]; if(o.items[k][1]){ s.appendChild(el('span','y',o.items[k][1])); } b.disabled=true; b.hidden=true; placed++; msg.textContent=placed<o.items.length?'Yes! What comes next?':''; if(placed===o.items.length) finish(); }
        else { misses++; msg.textContent='Not yet. Which one comes first of the ones left?'; b.classList.add('miss'); setTimeout(()=>b.classList.remove('miss'),900); }
      }); bank.appendChild(b); });
    function finish(){
      bank.innerHTML=''; const pct=misses===0?100:misses<=2?85:70; award(key,pct);
      msg.textContent='You did it! Everything is in order.'+(misses===0?' No mistakes, so you earned a star.':misses<=2?' You earned a star.':'');
      const a=el('div','actions'); const ag=el('button','btn','Play again'); ag.type='button'; ag.addEventListener('click',()=>runOrder(id,back)); const hm=el('button','btn alt','Back'); hm.type='button'; hm.addEventListener('click',back); a.appendChild(ag); a.appendChild(hm); panel.appendChild(a); ag.focus();
    }
  });
}

/* ---------- flashcards ---------- */
function runFlash(facts,title,back,key){
  let deck=shuffle(facts.slice()),i=0,known=0,missedIds=[],requeued={};
  view(root=>{
    const tb=el('div','topbar'); tb.appendChild(el('h2',null,title+': Flashcards')); const bk=el('button','btn alt','Back'); bk.type='button'; bk.addEventListener('click',back); tb.appendChild(bk); root.appendChild(tb);
    const panel=el('div','panel'); root.appendChild(panel); panel.setAttribute('aria-live','polite');
    function show(){
      panel.innerHTML=''; const f=deck[i]; let flipped=false;
      const pr=el('div','prog'); pr.appendChild(el('span',null,'Card '+(i+1)+' of '+deck.length)); const bar=el('div','bar'); const fill=el('i'); fill.style.width=(i/deck.length*100)+'%'; bar.appendChild(fill); pr.appendChild(bar); pr.appendChild(el('span','pill','Knew it: '+known)); panel.appendChild(pr);
      const card=el('div','fcard'); card.tabIndex=0; card.setAttribute('role','button'); panel.appendChild(card);
      const act=el('div','actions'); panel.appendChild(act);
      function front(){ card.innerHTML=''; card.appendChild(el('div',null,f.blank)); card.appendChild(el('small',null,'Tap the card to see the answer')); }
      function backSide(){ card.innerHTML=''; card.appendChild(el('div','ans',f.a)); card.appendChild(el('div','full',f.full)); act.innerHTML=''; const hb=el('button','btn alt','Hear it'); hb.type='button'; hb.addEventListener('click',e=>{ e.stopPropagation(); speak(f.full); }); act.appendChild(hb);
        const y=el('button','btn','I knew it'); y.type='button'; y.addEventListener('click',()=>{ known++; P.known[f.id]=1; delete P.weak[f.id]; advance(); });
        const n=el('button','btn alt','Study again'); n.type='button'; n.addEventListener('click',()=>{ P.weak[f.id]=1; if(missedIds.indexOf(f.id)<0) missedIds.push(f.id); if(!requeued[f.id]){ requeued[f.id]=1; deck.push(f); } advance(); });
        act.appendChild(y); act.appendChild(n); }
      function flip(){ if(flipped) return; flipped=true; backSide(); }
      card.addEventListener('click',flip); card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } });
      front(); const fb=el('button','btn','Show answer'); fb.type='button'; fb.addEventListener('click',flip); act.appendChild(fb);
    }
    function advance(){ i++; if(i<deck.length) show(); else done(); }
    function done(){
      const pct=Math.round(known/facts.length*100); save(); if(key) award(key,Math.min(100,pct));
      panel.innerHTML=''; const e=el('div','end'); e.appendChild(el('h3',null,'Deck complete!')); e.appendChild(el('p',null,'You knew '+known+' cards. '+(missedIds.length?missedIds.length+' to study again.':'None to study again.'))); if(key&&pct>=80) e.appendChild(el('p',null,'You earned a star for this activity.'));
      const a=el('div','actions'); if(missedIds.length){ const m=el('button','btn','Study the missed ones'); m.type='button'; m.addEventListener('click',()=>runFlash(missedIds.map(x=>BYID[x]),title+' (missed)',back,null)); a.appendChild(m); }
      const ag=el('button','btn alt','Shuffle and play again'); ag.type='button'; ag.addEventListener('click',()=>runFlash(facts,title,back,key)); const hm=el('button','btn alt','Back'); hm.type='button'; hm.addEventListener('click',back); a.appendChild(ag); a.appendChild(hm); e.appendChild(a); panel.appendChild(e);
    }
    show();
  });
}

/* ---------- match up ---------- */
function runMatch(facts,back,key){
  const seen={}; const picks=shuffle(facts).filter(f=>{ const l=f.a.toLowerCase(); if(f.a.length>24||seen[l]) return false; seen[l]=1; return true; }).slice(0,5);
  view(root=>{
    const tb=el('div','topbar'); tb.appendChild(el('h2',null,'Match Up')); const bk=el('button','btn alt','Back'); bk.type='button'; bk.addEventListener('click',back); tb.appendChild(bk); root.appendChild(tb);
    const panel=el('div','panel'); root.appendChild(panel); panel.setAttribute('aria-live','polite');
    if(picks.length<3){ panel.appendChild(el('p',null,'There are not enough short answers in this unit for a matching game. Try the quiz instead.')); return; }
    const pr=el('div','prog'); const tr=el('span',null,'Tries: 0'); const pm=el('span','pill','Matched: 0 of '+picks.length); pr.appendChild(tr); pr.appendChild(pm); panel.appendChild(pr);
    panel.appendChild(el('p','qsub','Tap a clue, then tap its answer.'));
    const grid=el('div','match'); panel.appendChild(grid); const L=el('div','col'),R=el('div','col'); grid.appendChild(L); grid.appendChild(R);
    const msg=el('div','msg'); msg.setAttribute('role','status'); panel.appendChild(msg);
    let sel=null,tries=0,matched=0;
    picks.forEach(f=>{ const b=el('button','mbtn',f.blank); b.type='button'; b.dataset.id=f.id; b.addEventListener('click',()=>{ if(b.classList.contains('done')) return; L.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; }); L.appendChild(b); });
    shuffle(picks).forEach(f=>{ const b=el('button','mbtn',f.a); b.type='button'; b.dataset.id=f.id; b.addEventListener('click',()=>{
      if(b.classList.contains('done')) return; if(!sel){ msg.textContent='First tap a clue on the left.'; return; }
      tries++; tr.textContent='Tries: '+tries;
      if(sel.dataset.id===b.dataset.id){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); matched++; pm.textContent='Matched: '+matched+' of '+picks.length; msg.textContent='Yes! That is a match.'; delete P.weak[b.dataset.id]; sel=null; if(matched===picks.length) finish(); }
      else { msg.textContent='Not a match. Try again.'; P.weak[sel.dataset.id]=1; sel.classList.remove('sel'); sel=null; }
    }); R.appendChild(b); });
    function finish(){ const pct=tries<=picks.length+2?100:tries<=picks.length*2?85:70; save(); award(key,pct); panel.appendChild(Object.assign(el('div','end'),{})); const e=$('.end',panel); e.appendChild(el('h3',null,'You matched them all!')); e.appendChild(el('p',null,'It took '+tries+' tries.'+(pct>=80?' You earned a star.':''))); const a=el('div','actions'); const ag=el('button','btn','Play again'); ag.type='button'; ag.addEventListener('click',()=>runMatch(facts,back,key)); const hm=el('button','btn alt','Back'); hm.type='button'; hm.addEventListener('click',back); a.appendChild(ag); a.appendChild(hm); e.appendChild(a); }
  });
}

/* ---------- practice test and weak spots ---------- */
function inScope(unit,scope){ const t=TRACKOF(unit); return scope==='all'||(scope==='us'&&t==='us')||(scope==='il'&&(t==='il'||t==='cmp')); }
function buildTest(scope,n){
  let pool=[];
  if(scope==='weak'){ pool=Object.keys(P.weak).filter(id=>BYID[id]).map(id=>mcFact(BYID[id])); }
  else { FACTS.filter(f=>f.unit!=='nums'&&inScope(f.unit,scope)).forEach(f=>pool.push(mcFact(f))); DATA.hq.filter(h=>inScope(h[0],scope)).forEach((h,i)=>{ pool.push(mcHQ(h,i)); pool.push(mcHQ(h,i)); }); }
  const byU={}; shuffle(pool).forEach(q=>{ (byU[q.unit]=byU[q.unit]||[]).push(q); });
  const keys=shuffle(Object.keys(byU)); const out=[],seen={};
  while(out.length<n&&keys.some(k=>byU[k].length)){ keys.forEach(k=>{ if(out.length>=n) return; let q; while((q=byU[k].shift())){ const sig=q.text; if(!seen[sig]){ seen[sig]=1; break; } q=null; } if(q) out.push(q); }); }
  return shuffle(out);
}
function testSetup(scope0){
  view(root=>{
    const tb=el('div','topbar'); tb.appendChild(el('h2',null,'Practice Test')); const bk=el('button','btn alt','Back to home'); bk.type='button'; bk.addEventListener('click',renderHome); tb.appendChild(bk); root.appendChild(tb);
    const panel=el('div','panel setup'); root.appendChild(panel);
    const st={scope:scope0||'all',n:20,mode:'practice'};
    function group(label,key,opts){ panel.appendChild(el('label','t',label)); const seg=el('div','seg'); opts.forEach(o=>{ const b=el('button',null,o[1]); b.type='button'; b.setAttribute('aria-pressed',String(st[key]===o[0])); b.addEventListener('click',()=>{ st[key]=o[0]; seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); }); seg.appendChild(b); }); panel.appendChild(seg); }
    const weakN=Object.keys(P.weak).length;
    group('What to study','scope',[['all','Everything'],['us','U.S. Constitution'],['il','Illinois Constitution']].concat(weakN?[['weak','My weak spots ('+weakN+')']]:[]));
    group('How many questions','n',[[10,'10'],[20,'20'],[30,'30']]);
    group('Mode','mode',[['practice','Practice: feedback after each question'],['test','Test: results at the end']]);
    const go=el('button','btn','Start'); go.type='button'; go.addEventListener('click',()=>{ const qs=buildTest(st.scope,st.n); runQuiz({title:(st.mode==='test'?'Test':'Practice')+': '+({all:'Everything',us:'U.S.',il:'Illinois',weak:'Weak spots'}[st.scope]),qs,mode:st.mode,back:renderHome,backLabel:'Home',again:()=>testSetup(st.scope)}); }); panel.appendChild(go);
  });
}
